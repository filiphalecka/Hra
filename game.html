/* nav */
.g-nav{
  background:rgba(13,10,6,.97);

}

/* main */

/* spinner */
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes orbit{to{transform:rotate(360deg);}}
@keyframes floatDot{0%,100%{transform:translateY(0);opacity:.35;}50%{transform:translateY(-14px);opacity:.8;}}
@keyframes ptsGlow{0%,100%{text-shadow:0 0 0 rgba(192,139,42,0);}50%{text-shadow:0 0 22px rgba(192,139,42,0.38);}}
@keyframes ringDraw{from{stroke-dashoffset:var(--c);}to{stroke-dashoffset:var(--o);}}
@keyframes shine{0%{transform:translateX(-120%);}100%{transform:translateX(220%);}}
@keyframes breathe{0%,100%{opacity:.55;transform:scale(1);}50%{opacity:1;transform:scale(1.04);}}
@keyframes slideInUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
.pts-glow{animation:ptsGlow 3.2s ease-in-out infinite;}
.bar-shine{position:absolute;top:0;left:0;height:100%;width:30%;background:linear-gradient(90deg,transparent,rgba(245,237,220,0.35),transparent);animation:shine 2.8s ease-in-out infinite;}

.card-game{transition:transform .2s cubic-bezier(.4,0,.2,1),box-shadow .2s,border-color .2s;}
.card-game:hover{transform:translateY(-3px);border-color:rgba(192,139,42,0.35)!important;box-shadow:0 12px 32px rgba(192,139,42,0.12);}

(function handleStripeReturn(){
  const params = new URLSearchParams(window.location.search);

  const handleLicense=(param,storageKey)=>{
    const val=params.get(param);
    if(val){
      const store=lsGet(storageKey)||{};
      store[val.toLowerCase()]={licensed:true,ts:Date.now()};
      lsSet(storageKey,store);
      window.history.replaceState({},'',window.location.pathname);

  handleLicense('region_licensed', 'hps:licensed_regions');
  handleLicense('state_licensed',  'hps:licensed_states');
  handleLicense('continent_licensed','hps:licensed_continents');

})();

// ── Firebase DB REST ──────────────────────────────────────────
const DB={
  getToken(){const s=lsGet('hps:session');return s?s.idToken:null;},
  async _get(path){
    const tok=this.getToken();
    const r=await fetch(FB_DB_URL+'/'+path+'.json'+(tok?'?auth='+tok:''));
    return await r.json();
  },
  async _put(path,data){
    const tok=this.getToken();
    const r=await fetch(FB_DB_URL+'/'+path+'.json'+(tok?'?auth='+tok:''),{
      method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    if(!r.ok){const txt=await r.text();throw new Error('DB PUT '+path+' failed: '+r.status+' '+txt);}
  },
  async _patch(path,data){
    const tok=this.getToken();
    const r=await fetch(FB_DB_URL+'/'+path+'.json'+(tok?'?auth='+tok:''),{
      method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    if(!r.ok){const txt=await r.text();throw new Error('DB PATCH '+path+' failed: '+r.status+' '+txt);}
  },
  async getPlayers(){
    if(USE_FIREBASE){try{return(await this._get('players'))||{};}catch{}}
    return lsGet('hps:players')||{};
  },
  async getTeams(){
    if(USE_FIREBASE){try{return(await this._get('teams'))||{};}catch{}}
    return lsGet('hps:teams')||{};
  },
  async getBigGroups(){
    if(USE_FIREBASE){try{return(await this._get('biggroups'))||{};}catch{}}
    return lsGet('hps:biggroups')||{};
  },
  async getLicensed(){
    if(USE_FIREBASE){try{return(await this._get('licensed'))||{};}catch{}}
    return lsGet('hps:licensed')||{};
  },
  async setLicensed(data){
    if(USE_FIREBASE){try{await this._put('licensed',data);return;}catch(e){console.warn(e);}}
    lsSet('hps:licensed',data);
  },
  // Merge-style write — used for granular updates that shouldn't clobber siblings
  async patchLicensed(partial){
    if(USE_FIREBASE){try{await this._patch('licensed',partial);return;}catch(e){console.warn(e);}}
    const cur=lsGet('hps:licensed')||{};
    for(const k of Object.keys(partial)){cur[k]={...(cur[k]||{}),...partial[k]};}
    lsSet('hps:licensed',cur);
  },

  async getCategories(){
    // Merge default + approved custom categories from DB
    if(USE_FIREBASE){
      try{
        const custom=await this._get('categories');
        const approved=(custom||{});
        const merged=[...DEFAULT_CATEGORIES];
        Object.values(approved).filter(c=>c.approved).forEach(c=>{
          if(!merged.find(m=>m.id===c.id)) merged.push(c);
        });
        return merged;
      }catch{}
    }
    // localStorage: merge with pending approved
    const custom=lsGet('hps:categories')||{};
    const merged=[...DEFAULT_CATEGORIES];
    Object.values(custom).filter(c=>c.approved).forEach(c=>{
      if(!merged.find(m=>m.id===c.id)) merged.push(c);
    });
    return merged;
  },
  async getPendingCategories(){
    if(USE_FIREBASE){try{const d=await this._get('categories');return Object.values(d||{}).filter(c=>!c.approved);}catch{}}
    const custom=lsGet('hps:categories')||{};
    return Object.values(custom).filter(c=>!c.approved);
  },
  async getCities(){
    if(USE_FIREBASE){try{return(await this._get('cities'))||{};}catch{}}
    return lsGet('hps:licensed_cities')||{};
  },
  async getCityFunding(){
    if(USE_FIREBASE){try{return(await this._get('cities_funding'))||{};}catch{}}
    return lsGet('hps:cities_funding')||{};
  },
  async setCityFunding(cityKey,data){
    if(USE_FIREBASE){try{await this._put('cities_funding/'+cityKey,data);return;}catch(e){console.warn(e);}}
    const f=lsGet('hps:cities_funding')||{};f[cityKey]=data;lsSet('hps:cities_funding',f);
  },
  async setPlayer(uid,data){
    if(USE_FIREBASE){try{await this._put('players/'+uid,data);return;}catch(e){console.warn(e);}}
    const p=lsGet('hps:players')||{};p[uid]=data;lsSet('hps:players',p);
  },
  async setTeam(id,data){
    if(USE_FIREBASE){try{await this._put('teams/'+id,data);return;}catch(e){console.warn(e);}}
    const t=lsGet('hps:teams')||{};t[id]=data;lsSet('hps:teams',t);
  },
  async setBigGroup(id,data){
    if(USE_FIREBASE){try{await this._put('biggroups/'+id,data);return;}catch(e){console.warn(e);}}
    const g=lsGet('hps:biggroups')||{};g[id]=data;lsSet('hps:biggroups',g);
  },
  async setCity(key,data){
    if(USE_FIREBASE){try{await this._put('cities/'+key,data);return;}catch(e){console.warn(e);}}
    const c=lsGet('hps:licensed_cities')||{};c[key]=data;lsSet('hps:licensed_cities',c);
  },
  async submitCategoryRequest(catData){
    // catData = { id, label, types, requestedBy, ts }
    if(USE_FIREBASE){try{await this._put('categories/'+catData.id,{...catData,approved:false});return;}catch(e){console.warn(e);}}
    const c=lsGet('hps:categories')||{};c[catData.id]={...catData,approved:false};lsSet('hps:categories',c);
  },
  async approveCategory(id){
    if(USE_FIREBASE){try{await this._patch('categories/'+id,{approved:true});return;}catch(e){console.warn(e);}}
    const c=lsGet('hps:categories')||{};if(c[id])c[id].approved=true;lsSet('hps:categories',c);
  },
  async rejectCategory(id){
    if(USE_FIREBASE){try{await this._put('categories/'+id,null);return;}catch(e){console.warn(e);}}
    const c=lsGet('hps:categories')||{};delete c[id];lsSet('hps:categories',c);
  },
  onPlayers(cb){
    const load=async()=>{cb(await this.getPlayers());};load();
    if(!USE_FIREBASE)return()=>{};
    let on=true;
    const poll=async()=>{if(!on)return;await load();setTimeout(poll,6000);};
    setTimeout(poll,6000);return()=>{on=false;};
  },
  onTeams(cb){
    const load=async()=>{cb(await this.getTeams());};load();
    if(!USE_FIREBASE)return()=>{};
    let on=true;
    const poll=async()=>{if(!on)return;await load();setTimeout(poll,6000);};
    setTimeout(poll,6000);return()=>{on=false;};
  },
  onLicensed(cb){
    const load=async()=>{cb(await this.getLicensed());};load();
    if(!USE_FIREBASE)return()=>{};
    let on=true;
    const poll=async()=>{if(!on)return;await load();setTimeout(poll,6000);};
    setTimeout(poll,6000);return()=>{on=false;};
  },
};

function isLicensed(storageKey,name){

}

function isCityLicensedS(licensed,n){const k=(n||'').toLowerCase().trim();return !!(licensed.cities&&licensed.cities[k]);}
function isRegionLicensedS(licensed,n){const k=(n||'').toLowerCase().trim();return !!(licensed.regions&&licensed.regions[k]);}
function isStateLicensedS(licensed,n){const k=(n||'').toLowerCase().trim();return !!(licensed.states&&licensed.states[k]);}
function isContinentLicensedS(licensed,n){const k=(n||'').toLowerCase().trim();return !!(licensed.continents&&licensed.continents[k]);}

function isCityLicensed(n){return isLicensed('hps:licensed_cities',n);}

function isStateLicensed(n){return isLicensed('hps:licensed_states',n);}
function isGlobalLicensed(){

function canPlayCity(me,lic){

  return pts&&licOk;

function canPlayContinent(me,lic){

function canPlayGlobal(me,lic){
  const pts=(me.points||0)>=GLOBAL_THRESHOLD;

}

function isContinentLicensed(n){return isLicensed('hps:licensed_continents',n);}

function countryToContinent(country){
  const sk=['Slovensko','Česko','Rakúsko','Nemecko','Poľsko','Maďarsko'];
  if(sk.includes(country)||country.startsWith('SK')||country.startsWith('CZ')||
     country.startsWith('AT')||country.startsWith('DE')||country.startsWith('PL')||
     country.startsWith('HU')) return 'Európa';
  return 'Iný kontinent';
}
function pct(val,max){return Math.min(100,Math.round((val/max)*100));}

  if(!r) return '';

function flagEmoji(cc){
  if(!cc||cc.length!==2) return '';
  const A=0x1F1E6;
  return String.fromCodePoint(...cc.toUpperCase().split('').map(c=>A+c.charCodeAt(0)-65));
}

  if(!regionLabel) return '🏳️';
  const m=regionLabel.match(/^([A-Z]{2})\s*·/);
  return m?flagEmoji(m[1]):'🏳️';
}

// ── Base components ───────────────────────────────────────────
function Inp({val,set,ph,type='text',onEnter,mono,mb0}){
  const[f,setF]=useState(false);
  return R('input',{type,value:val,onChange:e=>set(e.target.value),placeholder:ph,
    onKeyDown:e=>e.key==='Enter'&&onEnter&&onEnter(),
    onFocus:()=>setF(true),onBlur:()=>setF(false),
    style:{...S.inp,...(f?{borderColor:'rgba(250,245,239,0.45)'}:{}),
      ...(mono?{fontFamily:"'DM Mono',monospace",letterSpacing:'.1em'}:{}),
      ...(mb0?{marginBottom:0}:{})}});
}
function Sel({val,set,opts,ph}){
  return R('select',{value:val,onChange:e=>set(e.target.value),style:S.sel},
    R('option',{value:''},ph||'— Vyber —'),
    opts.map(o=>typeof o==='string'
      ?R('option',{key:o,value:o},o)
      :R('option',{key:o.value,value:o.value},o.label)));
}

// City autocomplete picker — searches Slovak municipalities
function CityPicker({val,onPick,ph}){
  const[q,setQ]=useState(val||'');
  const[open,setOpen]=useState(false);
  const[focus,setFocus]=useState(false);
  React.useEffect(()=>{setQ(val||'');},[val]);
  const matches=React.useMemo(()=>{
    const s=(q||'').toLowerCase().trim();
    if(s.length<2) return [];
    const res=[];
    for(let i=0;i<SK_OBCE.length&&res.length<8;i++){
      if(SK_OBCE[i][0].toLowerCase().indexOf(s)===0) res.push(SK_OBCE[i]);
    }
    // also substring matches if few prefix matches
    if(res.length<8){
      for(let i=0;i<SK_OBCE.length&&res.length<8;i++){
        const nm=SK_OBCE[i][0].toLowerCase();
        if(nm.indexOf(s)>0&&res.indexOf(SK_OBCE[i])<0) res.push(SK_OBCE[i]);
      }
    }
    return res;
  },[q]);
  return R('div',{style:{position:'relative'}},
    R('input',{type:'text',value:q,placeholder:ph||'Začni písať názov obce…',
      onChange:e=>{setQ(e.target.value);setOpen(true);},
      onFocus:()=>{setFocus(true);setOpen(true);},
      onBlur:()=>{setFocus(false);setTimeout(()=>setOpen(false),180);},
      style:{...S.inp,...(focus?{borderColor:'rgba(250,245,239,0.45)'}:{})}}),
    open&&matches.length>0&&R('div',{style:{
      position:'absolute',top:'100%',left:0,right:0,zIndex:50,
      background:'#1A1208',border:'1px solid rgba(192,139,42,0.3)',
      borderTop:'none',maxHeight:'220px',overflowY:'auto',
    }},
      ...matches.map(m=>R('div',{key:m[0]+m[1],
        onMouseDown:()=>{onPick(m[0],SK_REGIONS[m[1]],m[2]);setQ(m[0]);setOpen(false);},
        style:{
          padding:'.6rem .8rem',cursor:'pointer',
          borderBottom:'1px solid rgba(245,237,220,0.05)',
          display:'flex',justifyContent:'space-between',alignItems:'baseline',
        }},
        R('span',{style:{
          fontFamily:"'Libre Baskerville',serif",fontSize:'.92rem',color:'#F5EDD8',
        }},m[0]),
        R('span',{style:{
          fontFamily:"'IBM Plex Mono',monospace",fontSize:'.6rem',
          color:'rgba(192,139,42,0.5)',letterSpacing:'.05em',
        }},SK_REGIONS[m[1]])
      ))
    )
  );
}

// Soft lock — content always visible, just dimmed + header note when below threshold
function SoftLock({children,locked,lockMsg}){
  const kids=Array.isArray(children)?children:[children];
  if(!locked) return R('div',null,...kids);
  return R('div',null,
    R('div',{style:{
      display:'flex',alignItems:'center',gap:'.5rem',
      fontFamily:"'IBM Plex Mono',monospace",fontSize:'.6rem',
      letterSpacing:'.1em',textTransform:'uppercase',
      color:'rgba(192,139,42,0.6)',
      padding:'.55rem .7rem',marginBottom:'.5rem',
      background:'rgba(192,139,42,0.06)',
      border:'1px solid rgba(192,139,42,0.15)',
    }},
      R('span',null,'🔒'),
      R('span',null,lockMsg)
    ),
    R('div',{style:{opacity:0.55}},...kids)
  );
}
function FoggedList({children,locked,lockMsg}){
  if(!locked) return R('div',null,...(Array.isArray(children)?children:[children]));
  return R('div',{style:S.fogWrap},
    R('div',{style:S.fog},...(Array.isArray(children)?children:[children])),
    R('div',{style:S.fogOverlay},
      R('div',{style:{textAlign:'center'}},
        R('div',{style:{...S.fogLabel,marginBottom:'.3rem'}},'🔒 Uzamknuté'),
        R('div',{style:{fontFamily:"'DM Mono',monospace",fontSize:'.63rem',
          color:'rgba(250,245,239,0.25)'}},lockMsg||'Odomkni túto úroveň')
      )
    )
  );
}

function RankBadge({i}){
  const extra=i===0?{background:'#B8882A',borderColor:'#B8882A',color:'#1C1711',fontWeight:500}
    :i===1?{background:'rgba(200,200,200,0.18)'}
    :i===2?{background:'rgba(176,114,75,0.18)',color:'#E8A87C'}:{};
  return R('span',{style:{...S.rank,...extra}},i+1);
}

// ── Category Picker for BigGroup ──────────────────────────────
function CategoryPicker({categories,selectedCat,selectedType,onCat,onType,onRequestNew}){
  const cat=categories.find(c=>c.id===selectedCat);
  return R('div',null,
    R(Lbl,{c:'Kategória skupiny'}),
    R('div',{style:S.catGrid},
      categories.map(c=>R('button',{key:c.id,
        style:selectedCat===c.id?S.catBtnA:S.catBtn,
        onClick:()=>{onCat(c.id);onType('');}},
        c.label))
    ),
    // Type picker
    selectedCat&&cat&&cat.types.length>0&&R('div',{style:{marginBottom:'1rem'}},
      R(Lbl,{c:'Typ skupiny'}),
      R('div',null,
        cat.types.map(t=>R('span',{key:t,
          style:selectedType===t?S.typeChipA:S.typeChip,
          onClick:()=>onType(selectedType===t?'':t)},t))
      )
    ),
    // Request new category button
    R('button',{
      style:{...S.btnM,marginTop:'.5rem',fontSize:'.84rem',color:'rgba(184,136,42,0.7)',
        borderColor:'rgba(184,136,42,0.2)'},
      onClick:onRequestNew},
      '+ Navrhnúť novú kategóriu')
  );
}

// Level order for minLevel logic
const LEVEL_ORDER=['solo','team','city','region','state','global'];

function getMinLevel(me){
  // Highest unlocked level becomes the minimum
  if(canPlayGlobal(me)) return 'global';
  if(canPlayState(me))  return 'state';
  if(canPlayRegion(me)) return 'region';
  if(canPlayCity(me))   return 'city';
  if((me.teamIds||[]).length>0) return 'team';
  return 'solo';
}

// Level thresholds — must earn this many points to unlock tasks of this level
const LEVEL_THRESHOLDS = [0, 150, 300, 500, 750, 1050, 1400];
const LEVEL_NAMES_SK = ['Jednotlivec','Susedstvo','Mesto','Kraj','Štát','Kontinent','Svet'];
const LEVEL_NAMES_EN = ['Individual','Neighbourhood','City','Region','Country','Continent','World'];

// Get max unlocked level for a player
function getPlayerLevel(pts){
  let lvl = 0;
  for(let i = 1; i < LEVEL_THRESHOLDS.length; i++){
    if(pts >= LEVEL_THRESHOLDS[i]) lvl = i;
  }
  return lvl;
}

// Get all available tasks for a player (all tasks from level 0 to their current level)
function getAvailableTasks(pts){
  const lvl = getPlayerLevel(pts);
  return TASK_CATALOG.filter(t => t.level <= lvl);
}

// Daily task selection — deterministic based on date + uid, always includes 1 easy + 1 highest + 1 random
function getDailyTasks(pts, uid){
  const available = getAvailableTasks(pts);
  if(available.length <= 3) return available;

  // Seed from date + uid for deterministic daily rotation
  const today = new Date().toISOString().slice(0,10);
  let seed = 0;
  for(let i = 0; i < (today+uid).length; i++) seed = ((seed << 5) - seed + (today+uid).charCodeAt(i)) | 0;
  const rng = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };

  const easy = available.filter(t => t.level === 0);
  const highest = available.filter(t => t.level === getPlayerLevel(pts));
  const mid = available.filter(t => t.level > 0 && t.level < getPlayerLevel(pts));

  const picks = [];
  // 1. Always one easy (random from level 0)
  picks.push(easy[Math.floor(rng() * easy.length)]);
  // 2. One from highest level
  const h = highest.filter(t => t.id !== picks[0]?.id);
  if(h.length > 0) picks.push(h[Math.floor(rng() * h.length)]);
  // 3. One random from remaining
  const remaining = available.filter(t => !picks.find(p => p.id === t.id));
  if(remaining.length > 0) picks.push(remaining[Math.floor(rng() * remaining.length)]);

  return picks.slice(0, 3);
}

  // ── ENCOUNTER ─────────────────────────────────────────────
  // ── Level-aware task availability (moving resetter) ──────
  // RULES:
  //  - Bonding tasks have a max count (get blocked when exhausted)
  //  - Bridging tasks are ALWAYS available (never blocked, infinite)
  //  - The "resetter" is the highest bridging task of the player's CURRENT level
  //  - Doing the resetter clears ALL bonding counters (from every level)
  //  - As the player levels up, the resetter moves up; lower bridging tasks
  //    stay infinite but no longer reset anything
  //
  // Counters stored in player.taskCounters = { taskId: count, ... }

  const TASK_LIMITS = {
    bond_close:    { max: 3 },
    bond_deepen:   { max: 2 },
    bond_neighbor: { max: 3 },
    bond_community:{ max: 2 },
  };

  // The highest bridging task at each level — this is the resetter for that level
  const LEVEL_RESETTER = {
    0: 'bridge_stranger',
    1: 'bridge_neighbor',
    2: 'bridge_city',
    3: 'bridge_region',
    4: 'bridge_state',
    5: 'bridge_continent',
    6: 'bridge_world',
  };

  // Get the current resetter task id for a player (based on their level)
  function getResetterTask(pts){
    const lvl = getPlayerLevel(pts);
    return LEVEL_RESETTER[lvl] || 'bridge_stranger';
  }

  // Get counters from player profile
  function getTaskCounters(p){
    return p.taskCounters || {};
  }

  // Check if a specific task is available
  function isTaskAvailable(taskId, counters){
    const limit = TASK_LIMITS[taskId];
    if(!limit) return true; // bridging tasks = always available (infinite)
    const count = counters[taskId] || 0;
    return count < limit.max;
  }

  // Get remaining count for a task
  function taskRemaining(taskId, counters){
    const limit = TASK_LIMITS[taskId];
    if(!limit) return null; // unlimited
    const count = counters[taskId] || 0;
    return Math.max(0, limit.max - count);
  }

  // Get current count for a task
  function taskCount(taskId, counters){
    const limit = TASK_LIMITS[taskId];
    if(!limit) return null;
    return counters[taskId] || 0;
  }

  // After an encounter: increment bonding counter, or (if resetter) clear all bonding
  function updateCountersAfterEncounter(counters, taskId, playerPts){
    const newCounters = {...counters};
    const limit = TASK_LIMITS[taskId];
    if(limit){
      // Limited bonding task — increment its counter
      newCounters[taskId] = (newCounters[taskId] || 0) + 1;
    } else {
      // Bridging task — only the player's CURRENT resetter clears counters
      const resetter = getResetterTask(playerPts);
      if(taskId === resetter){
        // Reset ALL bonding counters from every level
        for(const tid of Object.keys(TASK_LIMITS)){
          newCounters[tid] = 0;
        }
      }
      // Lower-level bridging tasks stay infinite but reset nothing
    }
    return newCounters;
  }

  async function doEncounter(taskType, pts){
    const trimmed=note.trim();
    const wordCount=trimmed.split(/\s+/).filter(w=>w.length>0).length;
    if(!trimmed||trimmed.length<3||wordCount<2){
      setNe(getLang()==='sk'?'Napíš aspoň 2 slová o tom, čo sa stalo.':'Write at least 2 words about what happened.');
      return;
    }
    setBusy(true);
    try{
      const pl=await DB.getPlayers(),tm=await DB.getTeams();
      const uid=me.uid;
      // Map new task types to legacy bonding/bridging system
      const rawType=taskType||'bridging';
      const taskId=activeTask?activeTask.id:'bridge_stranger';
      // Map task ID to encounter type for backward compat
      const encTypeMap={'bond_close':'bonding1','bond_deepen':'bonding2','bond_neighbor':'bonding1','bond_community':'bonding1'};
      const type=encTypeMap[taskId]||rawType;
      const player=pl[uid]||{};

      // ── Task counter check ─────────────────────────────
      const counters=getTaskCounters(player);
      if(!isTaskAvailable(taskId, counters)){
        setNe(getLang()==='sk'?'Najprv urob reštartujúcu úlohu.':'Complete the reset task first.');
        setBusy(false);return;
      }

      // ── Update counters ──────────────────────────────────
      const newCounters=updateCountersAfterEncounter(counters, taskId, player.points||0);

      const encTypeSaved=type;
      const enc={note:note.trim(),date:new Date().toISOString(),level:playLevel,type:encTypeSaved,
        teamId:activeTeamId||null,city:me.city||'',country:me.country||'',public:encPublic};
      const prevPts=player.points||0;
      const p={...player,points:prevPts+(pts||1),encounters:[enc,...(Array.isArray(player.encounters)?player.encounters:player.encounters?Object.values(player.encounters):[]).filter(e=>e!=null).slice(0,49)],taskCounters:newCounters};
      await DB.setPlayer(uid,p);

      // Immediately update local state for instant UI response
      setMe(p);
      setPlayers(prev=>({...prev,[uid]:p}));

      // Points flow to player's small teams only (not up to biggroups)
      const myTeamIds=player.teamIds||[];
      for(const tid of myTeamIds){
        if(tm[tid]){
          await DB.setTeam(tid,{...tm[tid],points:(tm[tid].points||0)+(pts||1)});
        }
      }

      // ── Pyramídová kaskáda ───────────────────────────────────
      // Za každý bod: rodič +0.1, starý rodič +0.01, prastarý +0.001
      try {
        const plAll=await DB.getPlayers();
        let refCode=(plAll[uid]||{}).referredBy||null;
        const fractions=[0.1,0.01,0.001];
        for(let i=0;i<fractions.length&&refCode;i++){
          const referrer=Object.values(plAll).find(p=>p.referralCode===refCode);
          if(!referrer) break;
          const newPts=Math.round(((referrer.points||0)+fractions[i])*1000)/1000;
          await DB.setPlayer(referrer.uid,{...referrer,points:newPts});
          refCode=referrer.referredBy||null;
        }
      } catch(e){ console.warn('Pyramid cascade error:',e); }

      // Milestone check
      const milestones=[
        {thresh:cityThreshold(me.uid),msg:'Mestská úroveň odomknutá! 🏙️'},
        {thresh:REGION_THRESHOLD,msg:'Krajská úroveň odomknutá! 🗺️'},
        {thresh:STATE_THRESHOLD,msg:'Štátna úroveň odomknutá! 🇸🇰'},
        {thresh:CONTINENT_THRESHOLD,msg:'Kontinentálna úroveň odomknutá! 🌍'},
        {thresh:GLOBAL_THRESHOLD,msg:'Globálna úroveň odomknutá! 🌍'},
      ];
      const milestone=milestones.find(m=>prevPts<m.thresh&&(prevPts+1)>=m.thresh);

      await refreshAll();
      setNote('');setNe('');setEncPublic(true);
      if(milestone)shFlash(milestone.msg);
      else shFlash('Stretnutie zaznamenané! +1 bod');
      setScr('home');
    }finally{setBusy(false);}
  }

  async function doKickMember(teamId,memberUid){
    setBusy(true);
    try{
      const pl=await DB.getPlayers(),tm=await DB.getTeams();
      const team=tm[teamId];
      if(!team){setBusy(false);return;}
      // Only founder can kick, and can't kick themselves
      if(team.founderId!==me.uid){shFlash('Iba zakladateľ môže vyhadzovať členov.');setBusy(false);return;}
      if(memberUid===me.uid){shFlash('Zakladateľ sa nemôže vyhodiť — opusti skupinu cez ↩.');setBusy(false);return;}
      const member=pl[memberUid];
      const memberName=member?member.nickname:'člen';
      if(!confirm('Vyhodiť '+memberName+' zo skupiny '+team.name+'?')){setBusy(false);return;}
      // Remove from team members
      await DB.setTeam(teamId,{...team,members:(team.members||[]).filter(m=>m!==memberUid)});
      // Remove team from member's teamIds
      if(member){
        await DB.setPlayer(memberUid,{...member,teamIds:(member.teamIds||[]).filter(id=>id!==teamId)});
      }
      await refreshAll();
      shFlash(memberName+' bol vyhodený zo skupiny.');
    }finally{setBusy(false);}
  }

  // Join a biggroup into a parent biggroup (by code)
  async function doJoinParentGroup(bgId){
    const code=bgParentCode.trim().toUpperCase();
    if(!code){setBge2('Zadaj kód nadradenej skupiny.');return;}
    setBusy(true);
    try{
      const bg=await DB.getBigGroups();
      const parent=Object.values(bg).find(g=>g.code===code);
      if(!parent){setBge2('Skupina nenájdená.');setBusy(false);return;}
      if(parent.id===bgId){setBge2('Skupina nemôže byť rodičom samej seba.');setBusy(false);return;}
      // Check for circular reference
      let cur=parent;
      while(cur&&cur.parentId){
        if(cur.parentId===bgId){setBge2('Cyklická závislosť — táto skupina je už nadradená.');setBusy(false);return;}
        cur=bg[cur.parentId];
      }
      await DB.setBigGroup(bgId,{...bg[bgId],parentId:parent.id});
      await refreshAll();
      setBgParentCode('');setBge2('');shFlash('Skupina zaradená do '+parent.name+'!');
    }finally{setBusy(false);}
  }
