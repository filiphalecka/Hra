/* nav */
.g-nav{
  background:rgba(13,10,6,.97);

}

/* main */

/* spinner */
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes orbit{to{transform:rotate(360deg);}}
@keyframes floatDot{0%,100%{transform:translateY(0);opacity:.35;}50%{transform:translateY(-14px);opacity:.8;}}
@keyframes ptsGlow{0%,100%{text-shadow:0 0 0 rgba(192,139,42,0);}50%{text-shadow:0 0 22px rgba(192,139,42,0.38);}}
@keyframes ringDraw{from{stroke-dashoffset:var(--c);}to{stroke-dashoffset:var(--o);}}
@keyframes shine{0%{transform:translateX(-120%);}100%{transform:translateX(220%);}}
@keyframes breathe{0%,100%{opacity:.55;transform:scale(1);}50%{opacity:1;transform:scale(1.04);}}
@keyframes slideInUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
.pts-glow{animation:ptsGlow 3.2s ease-in-out infinite;}
.bar-shine{position:absolute;top:0;left:0;height:100%;width:30%;background:linear-gradient(90deg,transparent,rgba(245,237,220,0.35),transparent);animation:shine 2.8s ease-in-out infinite;}

.card-game{transition:transform .2s cubic-bezier(.4,0,.2,1),box-shadow .2s,border-color .2s;}
.card-game:hover{transform:translateY(-3px);border-color:rgba(192,139,42,0.35)!important;box-shadow:0 12px 32px rgba(192,139,42,0.12);}

(function handleStripeReturn(){
  const params = new URLSearchParams(window.location.search);

  const handleLicense=(param,storageKey)=>{
    const val=params.get(param);
    if(val){
      const store=lsGet(storageKey)||{};
      store[val.toLowerCase()]={licensed:true,ts:Date.now()};
      lsSet(storageKey,store);
      window.history.replaceState({},'',window.location.pathname);

  handleLicense('region_licensed', 'hps:licensed_regions');
  handleLicense('state_licensed',  'hps:licensed_states');
  handleLicense('continent_licensed','hps:licensed_continents');

})();

// ── Firebase DB REST ──────────────────────────────────────────
const DB={
  getToken(){const s=lsGet('hps:session');return s?s.idToken:null;},
  async _get(path){
    const tok=this.getToken();
    const r=await fetch(FB_DB_URL+'/'+path+'.json'+(tok?'?auth='+tok:''));
    return await r.json();
  },
  async _put(path,data){
    const tok=this.getToken();
    const r=await fetch(FB_DB_URL+'/'+path+'.json'+(tok?'?auth='+tok:''),{
      method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    if(!r.ok){const txt=await r.text();throw new Error('DB PUT '+path+' failed: '+r.status+' '+txt);}
  },
  async _patch(path,data){
    const tok=this.getToken();
    const r=await fetch(FB_DB_URL+'/'+path+'.json'+(tok?'?auth='+tok:''),{
      method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    if(!r.ok){const txt=await r.text();throw new Error('DB PATCH '+path+' failed: '+r.status+' '+txt);}
  },
  async getPlayers(){
    if(USE_FIREBASE){try{return(await this._get('players'))||{};}catch{}}
    return lsGet('hps:players')||{};
  },
  async getTeams(){
    if(USE_FIREBASE){try{return(await this._get('teams'))||{};}catch{}}
    return lsGet('hps:teams')||{};
  },
  async getBigGroups(){
    if(USE_FIREBASE){try{return(await this._get('biggroups'))||{};}catch{}}
    return lsGet('hps:biggroups')||{};
  },
  async getLicensed(){
    if(USE_FIREBASE){try{return(await this._get('licensed'))||{};}catch{}}
    return lsGet('hps:licensed')||{};
  },
  async setLicensed(data){
    if(USE_FIREBASE){try{await this._put('licensed',data);return;}catch(e){console.warn(e);}}
    lsSet('hps:licensed',data);
  },
  // Merge-style write — used for granular updates that shouldn't clobber siblings
  async patchLicensed(partial){
    if(USE_FIREBASE){try{await this._patch('licensed',partial);return;}catch(e){console.warn(e);}}
    const cur=lsGet('hps:licensed')||{};
    for(const k of Object.keys(partial)){cur[k]={...(cur[k]||{}),...partial[k]};}
    lsSet('hps:licensed',cur);
  },

  async getCategories(){
    // Merge default + approved custom categories from DB
    if(USE_FIREBASE){
      try{
        const custom=await this._get('categories');
        const approved=(custom||{});
        const merged=[...DEFAULT_CATEGORIES];
        Object.values(approved).filter(c=>c.approved).forEach(c=>{
          if(!merged.find(m=>m.id===c.id)) merged.push(c);
        });
        return merged;
      }catch{}
    }
    // localStorage: merge with pending approved
    const custom=lsGet('hps:categories')||{};
    const merged=[...DEFAULT_CATEGORIES];
    Object.values(custom).filter(c=>c.approved).forEach(c=>{
      if(!merged.find(m=>m.id===c.id)) merged.push(c);
    });
    return merged;
  },
  async getPendingCategories(){
    if(USE_FIREBASE){try{const d=await this._get('categories');return Object.values(d||{}).filter(c=>!c.approved);}catch{}}
    const custom=lsGet('hps:categories')||{};
    return Object.values(custom).filter(c=>!c.approved);
  },
  async getCities(){
    if(USE_FIREBASE){try{return(await this._get('cities'))||{};}catch{}}
    return lsGet('hps:licensed_cities')||{};
  },
  async getCityFunding(){
    if(USE_FIREBASE){try{return(await this._get('cities_funding'))||{};}catch{}}
    return lsGet('hps:cities_funding')||{};
  },
  async setCityFunding(cityKey,data){
    if(USE_FIREBASE){try{await this._put('cities_funding/'+cityKey,data);return;}catch(e){console.warn(e);}}
    const f=lsGet('hps:cities_funding')||{};f[cityKey]=data;lsSet('hps:cities_funding',f);
  },
  async setPlayer(uid,data){
    if(USE_FIREBASE){try{await this._put('players/'+uid,data);return;}catch(e){console.warn(e);}}
    const p=lsGet('hps:players')||{};p[uid]=data;lsSet('hps:players',p);
  },
  async setTeam(id,data){
    if(USE_FIREBASE){try{await this._put('teams/'+id,data);return;}catch(e){console.warn(e);}}
    const t=lsGet('hps:teams')||{};t[id]=data;lsSet('hps:teams',t);
  },
  async setBigGroup(id,data){
    if(USE_FIREBASE){try{await this._put('biggroups/'+id,data);return;}catch(e){console.warn(e);}}
    const g=lsGet('hps:biggroups')||{};g[id]=data;lsSet('hps:biggroups',g);
  },
  async setCity(key,data){
    if(USE_FIREBASE){try{await this._put('cities/'+key,data);return;}catch(e){console.warn(e);}}
    const c=lsGet('hps:licensed_cities')||{};c[key]=data;lsSet('hps:licensed_cities',c);
  },
  async submitCategoryRequest(catData){
    // catData = { id, label, types, requestedBy, ts }
    if(USE_FIREBASE){try{await this._put('categories/'+catData.id,{...catData,approved:false});return;}catch(e){console.warn(e);}}
    const c=lsGet('hps:categories')||{};c[catData.id]={...catData,approved:false};lsSet('hps:categories',c);
  },
  async approveCategory(id){
    if(USE_FIREBASE){try{await this._patch('categories/'+id,{approved:true});return;}catch(e){console.warn(e);}}
    const c=lsGet('hps:categories')||{};if(c[id])c[id].approved=true;lsSet('hps:categories',c);
  },
  async rejectCategory(id){
    if(USE_FIREBASE){try{await this._put('categories/'+id,null);return;}catch(e){console.warn(e);}}
    const c=lsGet('hps:categories')||{};delete c[id];lsSet('hps:categories',c);
  },
  onPlayers(cb){
    const load=async()=>{cb(await this.getPlayers());};load();
    if(!USE_FIREBASE)return()=>{};
    let on=true;
    const poll=async()=>{if(!on)return;await load();setTimeout(poll,6000);};
    setTimeout(poll,6000);return()=>{on=false;};
  },
  onTeams(cb){
    const load=async()=>{cb(await this.getTeams());};load();
    if(!USE_FIREBASE)return()=>{};
    let on=true;
    const poll=async()=>{if(!on)return;await load();setTimeout(poll,6000);};
    setTimeout(poll,6000);return()=>{on=false;};
  },
  onLicensed(cb){
    const load=async()=>{cb(await this.getLicensed());};load();
    if(!USE_FIREBASE)return()=>{};
    let on=true;
    const poll=async()=>{if(!on)return;await load();setTimeout(poll,6000);};
    setTimeout(poll,6000);return()=>{on=false;};
  },
};

function hasPaid(uid){return false;}
function cityThreshold(uid){return CITY_THRESHOLD;}
function isLicensed(storageKey,name){
  const c=lsGet(storageKey)||{};
  const k=(name||'').toLowerCase().trim();
  return !!(c[k]&&c[k].licensed);
}
// These now check React state — called with licensed state
function isCityLicensedS(licensed,n){const k=(n||'').toLowerCase().trim();return !!(licensed.cities&&licensed.cities[k]);}
function isRegionLicensedS(licensed,n){const k=(n||'').toLowerCase().trim();return !!(licensed.regions&&licensed.regions[k]);}
function isStateLicensedS(licensed,n){const k=(n||'').toLowerCase().trim();return !!(licensed.states&&licensed.states[k]);}
function isContinentLicensedS(licensed,n){const k=(n||'').toLowerCase().trim();return !!(licensed.continents&&licensed.continents[k]);}
function isGlobalLicensedS(licensed){return !!licensed.global;}
// Keep old for backward compat
function isCityLicensed(n){return isLicensed('hps:licensed_cities',n);}
function isRegionLicensed(n){return isLicensed('hps:licensed_regions',n);}
function isStateLicensed(n){return isLicensed('hps:licensed_states',n);}
function isGlobalLicensed(){
  const c=lsGet('hps:licensed_global')||{};
  return Object.values(c).some(v=>v&&v.licensed);
}
function canPlayCity(me,lic){
  const pts=(me.points||0)>=cityThreshold(me.uid);
  const licOk=lic?isCityLicensedS(lic,me.city||''):isCityLicensed(me.city||'');
  return pts&&licOk;
}
function canPlayRegion(me,lic){
  const pts=(me.points||0)>=REGION_THRESHOLD;
  const licOk=lic?isRegionLicensedS(lic,me.region||me.city||''):isRegionLicensed(me.region||me.city||'');
  return pts&&licOk;
}
function canPlayState(me,lic){
  const pts=(me.points||0)>=STATE_THRESHOLD;
  const licOk=lic?isStateLicensedS(lic,me.country||''):isStateLicensed(me.country||'');
  return pts&&licOk;
}
function canPlayContinent(me,lic){
  const pts=(me.points||0)>=CONTINENT_THRESHOLD;
  const cont=me.continent||countryToContinent(me.country||'');
  const licOk=lic?isContinentLicensedS(lic,cont):isContinentLicensed(cont);
  return pts&&licOk;
}
function canPlayGlobal(me,lic){
  const pts=(me.points||0)>=GLOBAL_THRESHOLD;
  const licOk=lic?isGlobalLicensedS(lic):isGlobalLicensed();
  return pts&&licOk;
}

function isContinentLicensed(n){return isLicensed('hps:licensed_continents',n);}

function countryToContinent(country){
  const sk=['Slovensko','Česko','Rakúsko','Nemecko','Poľsko','Maďarsko'];
  if(sk.includes(country)||country.startsWith('SK')||country.startsWith('CZ')||
     country.startsWith('AT')||country.startsWith('DE')||country.startsWith('PL')||
     country.startsWith('HU')) return 'Európa';
  return 'Iný kontinent';
}
function pct(val,max){return Math.min(100,Math.round((val/max)*100));}

  return String.fromCodePoint(...cc.toUpperCase().split('').map(c=>A+c.charCodeAt(0)-65));
}

// Regions look like "SK · Bratislavský kraj" — first 2 chars are ISO-2
function regionFlag(regionLabel){

function Inp({val,set,ph,type='text',onEnter,mono,mb0}){

      ...(mono?{fontFamily:"'DM Mono',monospace",letterSpacing:'.1em'}:{}),

}
function Sel({val,set,opts,ph}){
  return R('select',{value:val,onChange:e=>set(e.target.value),style:S.sel},
    R('option',{value:''},ph||'— Vyber —'),
    opts.map(o=>typeof o==='string'
      ?R('option',{key:o,value:o},o)
      :R('option',{key:o.value,value:o.value},o.label)));
}

// Hierarchical location picker — continent → country → region → city
// onPick receives (cityName, regionName, countryName, pop)
function CityPicker({val, onPick, ph, initialCountry, initialRegion, initialCity}){
  const[continent, setContinent] = useState('Európa');
  const[country, setCountryS] = useState(initialCountry||'');
  const[region, setRegionS] = useState(initialRegion||'');
  const[city, setCityS] = useState(initialCity||val||'');
  const[cityQuery, setCityQuery] = useState('');
  const[cityOpen, setCityOpen] = useState(false);

  // When city is set externally (e.g. user navigates back), sync
  React.useEffect(()=>{ if(val && !city) setCityS(val); }, [val]);

  const countries = continent ? getCountriesIn(continent) : [];
  const regions = (continent && country) ? getRegionsIn(continent, country) : [];
  const cities = (continent && country && region) ? getCitiesIn(continent, country, region) : [];

  const filteredCities = React.useMemo(()=>{
    const q = (cityQuery||'').toLowerCase().trim();
    if(!q) return cities.slice(0, 30);
    const prefix = cities.filter(c => c[0].toLowerCase().indexOf(q) === 0);
    const substr = cities.filter(c => c[0].toLowerCase().indexOf(q) > 0);
    return prefix.concat(substr).slice(0, 30);
  }, [cities, cityQuery]);

  // Styles
  const selectStyle = {...S.inp, background:'#1a1610', color:'#FAF5EF', cursor:'pointer'};
  // Options need explicit styling — native dropdowns inherit OS bg (often white)
  const optStyle = {background:'#1a1610', color:'#FAF5EF'};
  const chipRow = {display:'flex', flexWrap:'wrap', gap:'.4rem', marginBottom:'.6rem'};
  const chip = (active, completed) => ({
    fontFamily:"'IBM Plex Mono',monospace",
    fontSize:'.6rem',
    letterSpacing:'.08em',
    textTransform:'uppercase',
    padding:'.3rem .55rem',
    border:'1px solid '+(active?'#C08B2A':completed?'rgba(192,139,42,0.3)':'rgba(245,237,220,0.15)'),
    color: active?'#C08B2A':completed?'rgba(245,237,220,0.7)':'rgba(245,237,220,0.4)',
    background: active?'rgba(192,139,42,0.08)':'transparent',
  });

  return R('div', null,
    // Progress chips
    R('div', {style:chipRow},
      R('span', {style:chip(!country, !!continent)}, '① '+(continent||'Kontinent')),
      R('span', {style:chip(continent && !region, !!country)}, '② '+(country||'Krajina')),
      R('span', {style:chip(country && !city, !!region)}, '③ '+(region||'Kraj')),
      R('span', {style:chip(region && !city, !!city)}, '④ '+(city||'Obec'))
    ),

    // STEP 1: Continent (only Europe right now, but ready to expand)
    !country && R('div', {style:{marginBottom:'.7rem'}},
      R('div', {style:{fontFamily:"'IBM Plex Mono',monospace",fontSize:'.6rem',letterSpacing:'.18em',color:'rgba(192,139,42,0.7)',marginBottom:'.35rem',textTransform:'uppercase'}}, 'Kontinent'),
      R('select', {
        value: continent,
        onChange: e => { setContinent(e.target.value); setCountryS(''); setRegionS(''); setCityS(''); },
        style: selectStyle,
      },
        ...CONTINENTS.map(c => R('option', {key:c, value:c, style:optStyle}, c))
      )
    ),

    // STEP 2: Country
    continent && !region && R('div', {style:{marginBottom:'.7rem'}},
      R('div', {style:{fontFamily:"'IBM Plex Mono',monospace",fontSize:'.6rem',letterSpacing:'.18em',color:'rgba(192,139,42,0.7)',marginBottom:'.35rem',textTransform:'uppercase'}}, 'Krajina'),
      R('select', {
        value: country,
        onChange: e => { setCountryS(e.target.value); setRegionS(''); setCityS(''); setCityQuery(''); },
        style: selectStyle,
      },
        R('option', {value:'', style:optStyle}, '— Vyber krajinu —'),
        ...countries.map(c => R('option', {key:c, value:c, style:optStyle}, c))
      )
    ),

    // STEP 3: Region
    country && !city && R('div', {style:{marginBottom:'.7rem'}},
      R('div', {style:{fontFamily:"'IBM Plex Mono',monospace",fontSize:'.6rem',letterSpacing:'.18em',color:'rgba(192,139,42,0.7)',marginBottom:'.35rem',textTransform:'uppercase'}}, country==='Česko'?'Kraj':'Kraj'),
      R('select', {
        value: region,
        onChange: e => { setRegionS(e.target.value); setCityS(''); setCityQuery(''); },
        style: selectStyle,
      },
        R('option', {value:'', style:optStyle}, '— Vyber kraj —'),
        ...regions.map(r => R('option', {key:r, value:r, style:optStyle}, r))
      )
    ),

    // STEP 4: City — searchable autocomplete within region
    region && !city && R('div', {style:{marginBottom:'.5rem',position:'relative'}},
      R('div', {style:{fontFamily:"'IBM Plex Mono',monospace",fontSize:'.6rem',letterSpacing:'.18em',color:'rgba(192,139,42,0.7)',marginBottom:'.35rem',textTransform:'uppercase'}}, 'Obec ('+cities.length+')'),
      R('input', {
        type:'text', value: cityQuery,
        placeholder: ph||'Začni písať alebo vyber zo zoznamu…',
        onChange: e => { setCityQuery(e.target.value); setCityOpen(true); },
        onFocus: () => setCityOpen(true),
        onBlur: () => setTimeout(()=>setCityOpen(false), 200),
        style: S.inp,
      }),
      cityOpen && filteredCities.length > 0 && R('div', {style:{
        position:'absolute',top:'100%',left:0,right:0,zIndex:50,
        background:'#1A1208',border:'1px solid rgba(192,139,42,0.3)',
        borderTop:'none',maxHeight:'240px',overflowY:'auto',
      }},
        ...filteredCities.map(c => R('div', {key:c[0]+c[1],
          onMouseDown: () => {
            setCityS(c[0]);
            setCityOpen(false);
            onPick(c[0], region, country, c[1]);
          },
          style: {
            padding:'.55rem .8rem', cursor:'pointer',
            borderBottom:'1px solid rgba(245,237,220,0.05)',
            display:'flex', justifyContent:'space-between', alignItems:'baseline', gap:'.5rem',
          }},
          R('span', {style:{fontFamily:"'Libre Baskerville',serif",fontSize:'.92rem',color:'#F5EDD8'}}, c[0]),
          c[1] > 800 && R('span', {style:{fontFamily:"'IBM Plex Mono',monospace",fontSize:'.58rem',color:'rgba(192,139,42,0.5)'}}, c[1].toLocaleString('sk')+' obyv.')
        ))
      )
    ),

    // Show selected + "change" link
    city && R('div', {style:{
      display:'flex',justifyContent:'space-between',alignItems:'center',
      padding:'.6rem .8rem',
      background:'rgba(192,139,42,0.06)',
      border:'1px solid rgba(192,139,42,0.25)',
      marginTop:'.3rem',
    }},
      R('div', null,
        R('div', {style:{fontFamily:"'Libre Baskerville',serif",fontSize:'1rem',color:'#F5EDD8'}}, city),
        R('div', {style:{fontFamily:"'IBM Plex Mono',monospace",fontSize:'.6rem',color:'rgba(192,139,42,0.6)',letterSpacing:'.05em',marginTop:'.15rem'}}, region+' · '+country)
      ),
      R('button', {
        onClick: () => { setCityS(''); setRegionS(''); setCountryS(''); setCityQuery(''); },
        style: {
          fontFamily:"'IBM Plex Mono',monospace",fontSize:'.6rem',
          letterSpacing:'.12em',textTransform:'uppercase',
          background:'transparent',border:'1px solid rgba(245,237,220,0.2)',
          color:'rgba(245,237,220,0.6)',padding:'.35rem .7rem',cursor:'pointer',
        },
      }, 'Zmeniť')
    )
  );
}

    R('div',{style:{

  return R('div',{style:S.fogWrap},
    R('div',{style:S.fog},...(Array.isArray(children)?children:[children])),

// Level thresholds — must earn this many points to unlock tasks of this level
const LEVEL_THRESHOLDS = [0, 150, 300, 500, 750, 1050, 1400];
const LEVEL_NAMES_SK = ['Jednotlivec','Susedstvo','Mesto','Kraj','Štát','Kontinent','Svet'];
const LEVEL_NAMES_EN = ['Individual','Neighbourhood','City','Region','Country','Continent','World'];

// Get max unlocked level for a player
function getPlayerLevel(pts){
  let lvl = 0;
  for(let i = 1; i < LEVEL_THRESHOLDS.length; i++){
    if(pts >= LEVEL_THRESHOLDS[i]) lvl = i;
  }
  return lvl;
}

// Get all available tasks for a player (all tasks from level 0 to their current level)
function getAvailableTasks(pts){
  const lvl = getPlayerLevel(pts);
  return TASK_CATALOG.filter(t => t.level <= lvl);
}

// Daily task selection — deterministic based on date + uid, always includes 1 easy + 1 highest + 1 random
function getDailyTasks(pts, uid){
  const available = getAvailableTasks(pts);
  if(available.length <= 3) return available;

  // Seed from date + uid for deterministic daily rotation
  const today = new Date().toISOString().slice(0,10);
  let seed = 0;
  for(let i = 0; i < (today+uid).length; i++) seed = ((seed << 5) - seed + (today+uid).charCodeAt(i)) | 0;
  const rng = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };

  const easy = available.filter(t => t.level === 0);
  const highest = available.filter(t => t.level === getPlayerLevel(pts));
  const mid = available.filter(t => t.level > 0 && t.level < getPlayerLevel(pts));

  const picks = [];
  // 1. Always one easy (random from level 0)
  picks.push(easy[Math.floor(rng() * easy.length)]);
  // 2. One from highest level
  const h = highest.filter(t => t.id !== picks[0]?.id);
  if(h.length > 0) picks.push(h[Math.floor(rng() * h.length)]);
  // 3. One random from remaining
  const remaining = available.filter(t => !picks.find(p => p.id === t.id));
  if(remaining.length > 0) picks.push(remaining[Math.floor(rng() * remaining.length)]);

  return picks.slice(0, 3);
}

  async function adminUnlockGeo(type, name){
    if(!isAdmin(me)) return;
    setBusy(true);
    try{
      const lic=await DB.getLicensed();
      const key=(name||'').toLowerCase().trim();
      // Mark as licensed
      if(type==='city'){
        lic.cities=lic.cities||{};lic.cities[key]=true;
      } else if(type==='region'){
        lic.regions=lic.regions||{};lic.regions[key]=true;
      } else if(type==='state'){
        lic.states=lic.states||{};lic.states[key]=true;
      } else if(type==='continent'){
        lic.continents=lic.continents||{};lic.continents[key]=true;
      } else if(type==='global'){
        lic.global=true;
      }
      await DB.patchLicensed(lic);
      // Retroactive: update all matching players
      const pl=await DB.getPlayers();
      for(const p of Object.values(pl)){
        let matches=false;
        if(type==='city') matches=(p.city||'').toLowerCase().trim()===key;
        else if(type==='region') matches=(p.region||p.city||'').toLowerCase().trim()===key;
        else if(type==='state') matches=(p.country||'').toLowerCase().trim()===key;
        else if(type==='continent') matches=countryToContinent(p.country||'').toLowerCase().trim()===key;
        else if(type==='global') matches=true;
        if(matches && (p.points||0)>0){
          // Points already on player — geo leaderboard is computed from players
          // so nothing extra needed, just refresh
        }
      }
      await refreshAll();
      shFlash('Odomknuté: '+name+'! Body sa automaticky pripočítajú.');
    }finally{setBusy(false);}
  }

        await DB.setTeam(id,{...tm[id],active:!(tm[id].active!==false)});
      } else {
        const bg=await DB.getBigGroups();
        if(!bg[id])return;

  }

  async function deleteGroup(type, id){
    if(!window.confirm('Naozaj zmazať skupinu?'))return;
    setBusy(true);
    try{
      if(type==='team'){
        const pl=await DB.getPlayers(),tm=await DB.getTeams();
        // Remove from all players
        for(const uid of Object.keys(pl)){
          if((pl[uid].teamIds||[]).includes(id)){
            await DB.setPlayer(uid,{...pl[uid],teamIds:(pl[uid].teamIds||[]).filter(x=>x!==id)});
          }
        }
        await DB.setTeam(id,null);
      } else {
        const bg=await DB.getBigGroups();
        // Detach children
        for(const g of Object.values(bg)){
          if(g.parentId===id) await DB.setBigGroup(g.id,{...g,parentId:null});
        }
        // Detach teams
        const tm=await DB.getTeams();
        for(const t of Object.values(tm)){
          if(t.bigGroupId===id) await DB.setTeam(t.id,{...t,bigGroupId:null});
        }
        await DB.setBigGroup(id,null);
      }
      await refreshAll();
      shFlash('Skupina zmazaná.');
      setScr('team');
    }finally{setBusy(false);}
  }

  // ── AUTH ──────────────────────────────────────────────────
  async function doRegister(){
    setAe('');
    if(!email.trim()||!pw.trim()||!nick.trim()||!city.trim()||!country){setAe('Vyplň všetky polia vrátane kraja.');return;}
    if(pw!==pw2){setAe('Heslá sa nezhodujú.');return;}
    if(pw.length<6){setAe('Heslo musí mať aspoň 6 znakov.');return;}
    setBusy(true);
    try{
      if(USE_FIREBASE){
        const res=await AUTH.signUp(email.trim(),pw);
        const myCode=res.localId.substr(0,6).toUpperCase();
        const refBonus=referralCode.trim()?5:0;
        const profile={uid:res.localId,email:email.trim(),nickname:nick.trim(),
          city:city.trim(),region:country,country:regionToCountry(country),
          teamIds:[],bigGroupIds:[],points:refBonus,encounters:[],
          referralCode:myCode,
          referredBy:referralCode.trim()||null,bonding1Count:0,bonding2Count:0};
        // Session MUST be saved before DB.setPlayer — setPlayer reads idToken from it
        lsSet('hps:session',{uid:res.localId,idToken:res.idToken,email:email.trim()});
        await DB.setPlayer(res.localId,profile);
        // Give referrer 5 points
        if(referralCode.trim()){
          const allPl=await DB.getPlayers();
          const referrer=Object.values(allPl).find(p=>p.referralCode===referralCode.trim());
          if(referrer){
            await DB.setPlayer(referrer.uid,{...referrer,points:(referrer.points||0)+5});
          }
        }
        // Auto-join team if code provided at registration
        if(regTeamCode.trim()){
          const tmAll=await DB.getTeams();
          const team=Object.values(tmAll).find(t=>t.code===regTeamCode.trim());
          if(team&&(team.members||[]).length<8){
            await DB.setTeam(team.id,{...team,members:[...(team.members||[]),res.localId]});
            profile.teamIds=[team.id];
            await DB.setPlayer(res.localId,profile);
          }
        }
        const plR=await DB.getPlayers();
        setPlayers(plR);setMe(profile);setScr('home');
        if(refBonus>0) setTimeout(()=>shFlash('Vitaj! Dostal si +'+refBonus+' bodov za kód pozvania 🎉'),300);
      } else {
        const pl=lsGet('hps:players')||{};
        const uid='u_'+Date.now();
        const myCode=uid.substr(0,6).toUpperCase();
        // Verify referral code BEFORE giving bonus
        let validReferrer2=null;
        let validTeam2=null;
        if(referralCode.trim()){
          const allPlx=lsGet('hps:players')||{};
          validReferrer2=Object.values(allPlx).find(p=>p.referralCode===referralCode.trim())||null;
        }
        if(regTeamCode.trim()){
          const tmAllx=lsGet('hps:teams')||{};
          const team=Object.values(tmAllx).find(t=>t.code===regTeamCode.trim());
          if(team&&(team.members||[]).length<8) validTeam2=team;
        }
        const refBonus=(validReferrer2||validTeam2)?5:0;
        const profile={uid,email:email.trim(),nickname:nick.trim(),
          city:city.trim(),region:country,country:regionToCountry(country),
          teamIds:validTeam2?[validTeam2.id]:[],bigGroupIds:[],
          points:refBonus,encounters:[],
          referralCode:myCode,
          referredBy:referralCode.trim()||null,bonding1Count:0,bonding2Count:0};
        pl[uid]=profile;lsSet('hps:players',pl);
        // Give individual referrer +5 (only if valid)
        if(validReferrer2){
          const allPl=lsGet('hps:players')||{};
          allPl[validReferrer2.uid]={...validReferrer2,points:(validReferrer2.points||0)+5};
          lsSet('hps:players',allPl);
        }
        // Join team + give +5 to team AND each member
        if(validTeam2){
          const tmAll=lsGet('hps:teams')||{};
          validTeam2.members=[...(validTeam2.members||[]),uid];
          validTeam2.points=(validTeam2.points||0)+5;
          tmAll[validTeam2.id]=validTeam2;
          lsSet('hps:teams',tmAll);
          // Give +5 to each existing member (members before this new join)
          const allPl=lsGet('hps:players')||{};
          for(const memberUid of validTeam2.members){
            if(memberUid===uid) continue; // skip self
            const member=allPl[memberUid];
            if(member){
              allPl[memberUid]={...member,points:(member.points||0)+5};
            }
          }
          lsSet('hps:players',allPl);
        }
        lsSet('hps:session',{uid,email:email.trim()});
        setMe(profile);setPlayers(pl);setScr('home');
        if(refBonus>0) setTimeout(()=>shFlash('Vitaj! Dostal si +'+refBonus+' bodov za kód pozvania 🎉'),300);
      }
    }catch(e){setAe(authErrMsg(e.message));}
    finally{setBusy(false);}
  }

  // ── ENCOUNTER ─────────────────────────────────────────────
  // ── Level-aware task availability (moving resetter) ──────
  // RULES:
  //  - Bonding tasks have a max count (get blocked when exhausted)
  //  - Bridging tasks are ALWAYS available (never blocked, infinite)
  //  - The "resetter" is the highest bridging task of the player's CURRENT level
  //  - Doing the resetter clears ALL bonding counters (from every level)
  //  - As the player levels up, the resetter moves up; lower bridging tasks
  //    stay infinite but no longer reset anything
  //
  // Counters stored in player.taskCounters = { taskId: count, ... }

  const TASK_LIMITS = {
    bond_close:    { max: 3 },
    bond_deepen:   { max: 2 },
    bond_neighbor: { max: 3 },
    bond_community:{ max: 2 },
  };

  // The highest bridging task at each level — this is the resetter for that level
  const LEVEL_RESETTER = {
    0: 'bridge_stranger',
    1: 'bridge_neighbor',
    2: 'bridge_city',
    3: 'bridge_region',
    4: 'bridge_state',
    5: 'bridge_continent',
    6: 'bridge_world',
  };

  // Get the current resetter task id for a player (based on their level)
  function getResetterTask(pts){
    const lvl = getPlayerLevel(pts);
    return LEVEL_RESETTER[lvl] || 'bridge_stranger';
  }

  // Get counters from player profile
  function getTaskCounters(p){
    return p.taskCounters || {};
  }

  // Check if a specific task is available
  function isTaskAvailable(taskId, counters){
    const limit = TASK_LIMITS[taskId];
    if(!limit) return true; // bridging tasks = always available (infinite)
    const count = counters[taskId] || 0;
    return count < limit.max;
  }

  // Get remaining count for a task
  function taskRemaining(taskId, counters){
    const limit = TASK_LIMITS[taskId];
    if(!limit) return null; // unlimited
    const count = counters[taskId] || 0;
    return Math.max(0, limit.max - count);
  }

  // Get current count for a task
  function taskCount(taskId, counters){
    const limit = TASK_LIMITS[taskId];
    if(!limit) return null;
    return counters[taskId] || 0;
  }

  // After an encounter: increment bonding counter, or (if resetter) clear all bonding
  function updateCountersAfterEncounter(counters, taskId, playerPts){
    const newCounters = {...counters};
    const limit = TASK_LIMITS[taskId];
    if(limit){
      // Limited bonding task — increment its counter
      newCounters[taskId] = (newCounters[taskId] || 0) + 1;
    } else {
      // Bridging task — only the player's CURRENT resetter clears counters
      const resetter = getResetterTask(playerPts);
      if(taskId === resetter){
        // Reset ALL bonding counters from every level
        for(const tid of Object.keys(TASK_LIMITS)){
          newCounters[tid] = 0;
        }
      }
      // Lower-level bridging tasks stay infinite but reset nothing
    }
    return newCounters;
  }

  async function doEncounter(taskType, pts){
    const trimmed=note.trim();
    const wordCount=trimmed.split(/\s+/).filter(w=>w.length>0).length;
    if(!trimmed||trimmed.length<3||wordCount<2){
      setNe(getLang()==='sk'?'Napíš aspoň 2 slová o tom, čo sa stalo.':'Write at least 2 words about what happened.');
      return;
    }
    setBusy(true);
    try{
      const pl=await DB.getPlayers(),tm=await DB.getTeams();
      const uid=me.uid;
      // Map new task types to legacy bonding/bridging system
      const rawType=taskType||'bridging';
      const taskId=activeTask?activeTask.id:'bridge_stranger';
      // Map task ID to encounter type for backward compat
      const encTypeMap={'bond_close':'bonding1','bond_deepen':'bonding2','bond_neighbor':'bonding1','bond_community':'bonding1'};
      const type=encTypeMap[taskId]||rawType;
      const player=pl[uid]||{};

      // ── Task counter check ─────────────────────────────
      const counters=getTaskCounters(player);
      if(!isTaskAvailable(taskId, counters)){
        setNe(getLang()==='sk'?'Najprv urob reštartujúcu úlohu.':'Complete the reset task first.');
        setBusy(false);return;
      }

      // ── Update counters ──────────────────────────────────
      const newCounters=updateCountersAfterEncounter(counters, taskId, player.points||0);

      const encTypeSaved=type;
      const enc={note:note.trim(),date:new Date().toISOString(),level:playLevel,type:encTypeSaved,
        teamId:activeTeamId||null,city:me.city||'',country:me.country||'',public:encPublic};
      const prevPts=player.points||0;
      const p={...player,points:prevPts+(pts||1),encounters:[enc,...(Array.isArray(player.encounters)?player.encounters:player.encounters?Object.values(player.encounters):[]).filter(e=>e!=null).slice(0,49)],taskCounters:newCounters};
      await DB.setPlayer(uid,p);

      // Immediately update local state for instant UI response
      setMe(p);
      setPlayers(prev=>({...prev,[uid]:p}));

      // Points flow to player's small teams only (not up to biggroups)
      const myTeamIds=player.teamIds||[];
      for(const tid of myTeamIds){
        if(tm[tid]){
          await DB.setTeam(tid,{...tm[tid],points:(tm[tid].points||0)+(pts||1)});
        }
      }

      // ── Pyramídová kaskáda ───────────────────────────────────
      // Za každý bod: rodič +0.1, starý rodič +0.01, prastarý +0.001
      try {
        const plAll=await DB.getPlayers();
        let refCode=(plAll[uid]||{}).referredBy||null;
        const fractions=[0.1,0.01,0.001];
        for(let i=0;i<fractions.length&&refCode;i++){
          const referrer=Object.values(plAll).find(p=>p.referralCode===refCode);
          if(!referrer) break;
          const newPts=Math.round(((referrer.points||0)+fractions[i])*1000)/1000;
          await DB.setPlayer(referrer.uid,{...referrer,points:newPts});
          refCode=referrer.referredBy||null;
        }
      } catch(e){ console.warn('Pyramid cascade error:',e); }

      // Milestone check
      const milestones=[
        {thresh:cityThreshold(me.uid),msg:'Mestská úroveň odomknutá! 🏙️'},
        {thresh:REGION_THRESHOLD,msg:'Krajská úroveň odomknutá! 🗺️'},
        {thresh:STATE_THRESHOLD,msg:'Štátna úroveň odomknutá! 🇸🇰'},
        {thresh:CONTINENT_THRESHOLD,msg:'Kontinentálna úroveň odomknutá! 🌍'},
        {thresh:GLOBAL_THRESHOLD,msg:'Globálna úroveň odomknutá! 🌍'},
      ];
      const milestone=milestones.find(m=>prevPts<m.thresh&&(prevPts+1)>=m.thresh);

      await refreshAll();
      setNote('');setNe('');setEncPublic(true);
      if(milestone)shFlash(milestone.msg);
      else shFlash('Stretnutie zaznamenané! +1 bod');
      setScr('home');
    }finally{setBusy(false);}
  }

  async function doKickMember(teamId,memberUid){
    setBusy(true);
    try{
      const pl=await DB.getPlayers(),tm=await DB.getTeams();
      const team=tm[teamId];
      if(!team){setBusy(false);return;}
      // Only founder can kick, and can't kick themselves
      if(team.founderId!==me.uid){shFlash('Iba zakladateľ môže vyhadzovať členov.');setBusy(false);return;}
      if(memberUid===me.uid){shFlash('Zakladateľ sa nemôže vyhodiť — opusti skupinu cez ↩.');setBusy(false);return;}
      const member=pl[memberUid];
      const memberName=member?member.nickname:'člen';
      if(!confirm('Vyhodiť '+memberName+' zo skupiny '+team.name+'?')){setBusy(false);return;}
      // Remove from team members
      await DB.setTeam(teamId,{...team,members:(team.members||[]).filter(m=>m!==memberUid)});
      // Remove team from member's teamIds
      if(member){
        await DB.setPlayer(memberUid,{...member,teamIds:(member.teamIds||[]).filter(id=>id!==teamId)});
      }
      await refreshAll();
      shFlash(memberName+' bol vyhodený zo skupiny.');
    }finally{setBusy(false);}
  }

  // Create a NEW parent biggroup and attach current group to it
  async function doCreateParentGroup(childBgId){
    const name=bgParentName.trim();
    if(!name){setBge2('Zadaj názov.');return;}
    if(!bgParentCat){setBge2('Vyber kategóriu.');return;}
    setBusy(true);
    try{
      const bg=await DB.getBigGroups();
      const child=bg[childBgId];
      if(!child){setBge2('Skupina nenájdená.');setBusy(false);return;}
      const id='bg_'+Date.now(),code=genCode();
      // Create new parent group
      await DB.setBigGroup(id,{id,name,code,teamIds:[],members:[me.uid],
        points:0,founderId:me.uid,category:bgParentCat,
        type:bgParentType||null,parentId:null});
      // Attach child to new parent
      await DB.setBigGroup(childBgId,{...child,parentId:id});

      setBgParentName('');setBgParentCat('');setBgParentType('');
      setBge2('');setShowCreateParent(false);

  // Join a biggroup into a parent biggroup (by code)
  async function doJoinParentGroup(bgId){
    const code=bgParentCode.trim().toUpperCase();
    if(!code){setBge2('Zadaj kód nadradenej skupiny.');return;}
    setBusy(true);
    try{
      const bg=await DB.getBigGroups();
      const parent=Object.values(bg).find(g=>g.code===code);
      if(!parent){setBge2('Skupina nenájdená.');setBusy(false);return;}
      if(parent.id===bgId){setBge2('Skupina nemôže byť rodičom samej seba.');setBusy(false);return;}
      // Check for circular reference
      let cur=parent;
      while(cur&&cur.parentId){
        if(cur.parentId===bgId){setBge2('Cyklická závislosť — táto skupina je už nadradená.');setBusy(false);return;}
        cur=bg[cur.parentId];
      }
      await DB.setBigGroup(bgId,{...bg[bgId],parentId:parent.id});
      await refreshAll();
      setBgParentCode('');setBge2('');shFlash('Skupina zaradená do '+parent.name+'!');
    }finally{setBusy(false);}
  }

            R(Inp,{val:pw2,set:setPw2,ph:'zopakuj heslo',type:'password'}),

  // ── VERIFY SCREEN ─────────────────────────────────────────
  if(scr==='verify'){
    return R('div',{style:{padding:'2rem 1.5rem',textAlign:'center'}},
      R('div',{style:{fontSize:'3rem',marginBottom:'1.5rem'}},'📧'),
      R('h2',{style:H2Style},'Overiť e-mail'),
      R('p',{style:{color:'rgba(245,237,220,0.5)',fontFamily:"'IBM Plex Mono',monospace",fontSize:'.87rem',lineHeight:1.8,marginBottom:'2rem'}},
        'Na tvoj e-mail sme poslali overovací odkaz.'),
      R('button',{onClick:doCheckVerified,disabled:busy,style:BigBtn('#8C2410','#B5451B')},busy?'…':'Skontrolovať'),
      R('button',{onClick:doResendVerify,style:{...BigBtn('transparent','rgba(245,237,220,0.06)'),marginTop:'.5rem',border:'1px solid rgba(245,237,220,0.12)'}},

  // ── HOME SCREEN ────────────────────────────────────────────
  if(scr==='home'){
    // ── Identity resolver ────────────────────────────────
    const vi = (()=>{
      const sk=getLang()==='sk';
      const myPts=me.points||0;
      const myLvl=getPlayerLevel(myPts);
      const lic=licensed||{};
      const cityKey=(me.city||'').toLowerCase().trim();
      const isCityLic=!!(lic.cities&&lic.cities[cityKey]);
      const isRegionLic=!!(lic.regions&&lic.regions[(me.region||'').toLowerCase().trim()]);
      const isStateLic=!!(lic.states&&lic.states[(me.country||'').toLowerCase().trim()]);
      const isContinentLic=!!(lic.continents&&lic.continents[(countryToContinent(me.country||'')||'').toLowerCase().trim()]);

      const identities = [
        {id:'me',name:me.nickname,pts:myPts,icon:'I',color:'#B8882A',unlocked:true,label:sk?'Ja':'Me'},
      ];
      // Small teams
      (me.teamIds||[]).forEach(tid=>{
        const tm=teams[tid];
        if(tm) identities.push({id:'team:'+tid,name:tm.name,pts:tm.points||0,icon:'II',color:'#2D6A4F',unlocked:true,label:sk?'Skupina':'Team'});
      });
      // Geo — needs level + license
      if(me.city) identities.push({id:'city',name:me.city,
        pts:Object.values(players).filter(p=>p.city===me.city).reduce((s,p)=>s+(p.points||0),0),
        icon:'III',color:'#C4860A',unlocked:myLvl>=2&&isCityLic,
        needLevel:myLvl<2,needLicense:!isCityLic,label:sk?'Mesto':'City'});
      if(me.region) identities.push({id:'region',name:me.region,
        pts:Object.values(players).filter(p=>p.region===me.region).reduce((s,p)=>s+(p.points||0),0),
        icon:'IV',color:'#3B6FD4',unlocked:myLvl>=3&&isRegionLic,
        needLevel:myLvl<3,needLicense:!isRegionLic,label:sk?'Kraj':'Region'});
      if(me.country) identities.push({id:'state',name:me.country,
        pts:Object.values(players).filter(p=>p.country===me.country).reduce((s,p)=>s+(p.points||0),0),
        icon:'V',color:'#534AB7',unlocked:myLvl>=4&&isStateLic,
        needLevel:myLvl<4,needLicense:!isStateLic,label:sk?'Stat':'Country'});
      // Continent
      const myContinent=countryToContinent(me.country||'');
      if(myContinent) identities.push({id:'continent',name:myContinent,
        pts:Object.values(players).filter(p=>countryToContinent(p.country||'')===myContinent).reduce((s,p)=>s+(p.points||0),0),
        icon:'VI',color:'#993556',unlocked:myLvl>=5&&isContinentLic,
        needLevel:myLvl<5,needLicense:!isContinentLic,label:sk?'Kontinent':'Continent'});

      const active = identities.find(i=>i.id===viewId) || identities[0];
      return {identities, active};
    })();

    // Auto-set highest unlocked identity on first load
    if(!window.__viewIdInitDone&&vi.identities.length>1){
      window.__viewIdInitDone=true;
      const highest=vi.identities.slice().reverse().find(i=>i.unlocked);
      if(highest&&highest.id!=='me') setTimeout(()=>setViewId(highest.id),0);
    }

    const lbPlayers=sPlayers.slice(0,5);
    const myRank=sPlayers.findIndex(p=>p.uid===me.uid)+1;
    const myTeamIds=me.teamIds||[];
    const above=sPlayers[myRank-2]||null;
    const ptsDiff=above?(above.points||0)-(me.points||0):0;
    // Task availability handled by TASK_LIMITS + taskCounters

    // ── World ring geometry ───────────────────────────────
    const worldTarget=4150000000; // 50% of 8.3B
    const worldPct=Math.min(100,(globalStats.count/worldTarget)*100);
    const ringR=88, ringC=2*Math.PI*ringR;
    const ringOffset=ringC*(1-Math.max(0.003,worldPct/100)); // min visible sliver
    const sk=getLang()==='sk';

    return R('div',{style:{paddingBottom:'5rem',position:'relative'}},

      // ── AMBIENT PARTICLES ────────────────────────────────

          left:((5+i*7.1)%90)+'%',
          top:((5+i*13.7)%88)+'%',

      // ── TOP BAR ──────────────────────────────────────────
      R('div',{style:{
        position:'sticky',top:0,zIndex:50,
        display:'flex',alignItems:'center',justifyContent:'space-between',
        padding:'.6rem 1rem',
        background:'rgba(13,10,6,0.88)',backdropFilter:'blur(14px)',

        R('div',{style:{display:'flex',alignItems:'center',gap:'.4rem'}},

              cursor:'pointer',
              appearance:'none',WebkitAppearance:'none',
              paddingRight:'1rem',
              maxWidth:'180px',
              overflow:'hidden',textOverflow:'ellipsis',
            }},
            ...vi.identities.map(id=>
              R('option',{key:id.id,value:id.id,disabled:!id.unlocked,
                style:{background:'#1A1008',color:id.unlocked?'#F5EDD8':'rgba(245,237,220,0.3)'}},
                (id.unlocked?'':'\u{1F512} ')+id.name+(id.id==='me'?'':' ('+id.label+')')
              )
            )
          ),
          R('span',{style:{
            fontFamily:"'IBM Plex Mono',monospace",
            fontSize:'.65rem',color:'rgba(192,139,42,0.5)',
            marginLeft:'.15rem',pointerEvents:'none',
          }},'\u25BE')
        ),
        R('div',{style:{display:'flex',gap:'.35rem',alignItems:'center'}},
          isAdmin(me)&&R('button',{onClick:()=>window.location.href='admin.html',style:MiniBtn},'Admin'),
          R('button',{onClick:()=>setLang(getLang()==='sk'?'en':'sk'),style:MiniBtn},getLang()==='sk'?'EN':'SK'),
          R('button',{onClick:doLogout,style:{...MiniBtn,color:'rgba(181,69,27,0.72)',borderColor:'rgba(181,69,27,0.28)'}},'↩')
        )
      ),

      R(Fl,{msg:flash}),

      // ══ WORLD HERO ═══════════════════════════════════════
      R('div',{style:{
        position:'relative',zIndex:2,
        margin:'1.25rem 1rem .25rem',
        padding:'1.4rem 1rem 1.6rem',
        background:'radial-gradient(ellipse at 50% 20%, rgba(192,139,42,0.12) 0%, rgba(140,36,16,0.04) 45%, transparent 75%)',
        border:'1px solid rgba(192,139,42,0.18)',
        borderTop:'2px solid rgba(192,139,42,0.5)',
        textAlign:'center',
        animation:'slideInUp .7s ease both',
      }},
        R('div',{style:{
          fontFamily:"'IBM Plex Mono',monospace",
          fontSize:'.9rem',letterSpacing:'.28em',
          color:'rgba(192,139,42,0.7)',
          textTransform:'uppercase',marginBottom:'.15rem',
        }},sk?'· svet · cieľ 50% populácie ·':'· world · goal 50% of humanity ·'),

        // SVG ring + count
        R('div',{style:{position:'relative',display:'inline-block',margin:'.4rem 0 .85rem'}},
          R('svg',{width:200,height:200,viewBox:'0 0 200 200',style:{display:'block'}},
            R('defs',null,
              R('linearGradient',{id:'ringGrad',x1:'0%',y1:'0%',x2:'100%',y2:'100%'},
                R('stop',{offset:'0%',stopColor:'#8C2410'}),
                R('stop',{offset:'55%',stopColor:'#C08B2A'}),
                R('stop',{offset:'100%',stopColor:'#F5EDD8'})
              )
            ),
            // Base ring
            R('circle',{cx:100,cy:100,r:ringR,fill:'none',
              stroke:'rgba(245,237,220,0.06)',strokeWidth:2}),
            // Progress arc
            R('circle',{cx:100,cy:100,r:ringR,fill:'none',
              stroke:'url(#ringGrad)',strokeWidth:3,strokeLinecap:'round',
              strokeDasharray:ringC,strokeDashoffset:ringOffset,
              transform:'rotate(-90 100 100)',
              style:{transition:'stroke-dashoffset 1.8s cubic-bezier(.6,.05,.3,1)',
                     filter:'drop-shadow(0 0 6px rgba(192,139,42,0.45))'}
            }),
            // Orbiting pulse-dot (group rotates around 100,100)
            R('g',{style:{
              transformOrigin:'100px 100px',
              animation:'orbit 22s linear infinite',
            }},
              R('circle',{cx:100,cy:100-ringR,r:3.5,fill:'#F5EDD8',
                style:{filter:'drop-shadow(0 0 8px #C08B2A)'}})
            )
          ),
          // Centered text
          R('div',{style:{
            position:'absolute',top:'50%',left:'50%',
            transform:'translate(-50%,-50%)',
            textAlign:'center',pointerEvents:'none',width:'80%',
          }},
            R('div',{style:{
              fontFamily:"'Bebas Neue',sans-serif",
              fontSize:'2.6rem',letterSpacing:'.04em',
              color:'#F5EDD8',lineHeight:.95,
              animation:'breathe 4s ease-in-out infinite',
            }},globalStats.count.toLocaleString(sk?'sk-SK':'en-US')),
            R('div',{style:{
              fontFamily:"'IBM Plex Mono',monospace",
              fontSize:'.63rem',letterSpacing:'.18em',
              color:'rgba(245,237,220,0.35)',
              textTransform:'uppercase',marginTop:'.25rem',
            }},sk?'hráčov na svete':'players worldwide'),
            R('div',{style:{
              fontFamily:"'IBM Plex Mono',monospace",
              fontSize:'.9rem',color:'#C08B2A',marginTop:'.4rem',
              letterSpacing:'.12em',
            }},globalStats.pctDisplay+'%')
          )
        ),
        // missing line
        R('div',{style:{
          fontFamily:"'Libre Baskerville',serif",
          fontSize:'.84rem',fontStyle:'italic',
          color:'rgba(245,237,220,0.48)',marginTop:'.35rem',
        }},sk?'chýba ešte ':'still missing ',
          R('span',{style:{color:'#C08B2A',fontWeight:600,fontStyle:'normal'}},
            globalStats.missing.toLocaleString(sk?'sk-SK':'en-US')),
          sk?' ľudí':' people'
        ),
        // See world leaderboard
        R('button',{onClick:()=>{setLbTab('global');setScr('lb');},
          style:{
            marginTop:'.9rem',
            fontFamily:"'IBM Plex Mono',monospace",fontSize:'.87rem',
            letterSpacing:'.18em',textTransform:'uppercase',
            color:'#F5EDD8',
            background:'transparent',
            border:'1px solid rgba(192,139,42,0.45)',
