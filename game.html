  // ── LOG SCREEN ─────────────────────────────────────────────
  if(scr==='log'){
    const task=activeTask||{id:'bridge_stranger',pts:3,emoji:'🤝',title:t('bridgingTitle')||'Nové zoznámenie',color:'#8C2410',taskType:'bridging'};
    const isBonding=(task.taskType||task.id)==='bonding';
    const bondingHint=BONDING_HINTS[playLevel]||BONDING_HINTS.solo;
    const nextPts=(me.points||0)+task.pts;

    return R('div',{style:{padding:'1rem 1rem 5rem'}},
      R(Bk,{to:'home',set:setScr,l:t('back')}),
      R(Fl,{msg:flash}),

      // Task header
      R('div',{style:{
        display:'flex',alignItems:'center',gap:'1rem',
        padding:'1rem 1.25rem',marginBottom:'1.5rem',
        background:isBonding?'rgba(192,139,42,0.08)':'rgba(140,36,16,0.1)',
        border:'1px solid '+(isBonding?'rgba(192,139,42,0.22)':'rgba(140,36,16,0.28)'),
      }},
        R('div',{style:{fontSize:'2.2rem',lineHeight:1,flexShrink:0}},task.emoji),
        R('div',{style:{flex:1}},
          R('div',{style:{
            fontFamily:"'IBM Plex Mono',monospace",fontSize:'.84rem',
            letterSpacing:'.15em',textTransform:'uppercase',
            color:'rgba(192,139,42,0.6)',marginBottom:'.2rem',
          }},task.title),
          R('div',{style:{
            fontFamily:"'IBM Plex Mono',monospace",fontSize:'.87rem',
            color:'rgba(245,237,220,0.3)',
          }},task.hint||(isBonding?bondingHint:'Oslovi cudzinca, vymeňte si kontakty alebo mená.'))
        ),
        R('div',{style:{
          fontFamily:"'Bebas Neue',sans-serif",
          fontSize:'2rem',letterSpacing:'.05em',
          color:task.color,flexShrink:0,
        }},'+'+task.pts)
      ),

      // Level picker
      R(LevelPicker,{
        selected:playLevel,onSelect:setPlayLevel,me,
        myTeams,activeTeamId,onTeamChange:setActiveTeamId,licensed,
      }),

      // Note input
      R('div',{style:{marginBottom:'1.25rem'}},
        R('div',{style:{
          fontFamily:"'IBM Plex Mono',monospace",fontSize:'.87rem',
          letterSpacing:'.12em',textTransform:'uppercase',
          color:'rgba(245,237,220,0.35)',marginBottom:'.5rem',
          display:'block',
        }},isBonding?t('noteB')||'Čo si urobil a pre koho?':t('note')||'Pár slov o stretnutí'),
        R('textarea',{
          value:note,
          onChange:e=>{setNote(e.target.value);if(ne)setNe('');},
          placeholder:isBonding
            ?(t('notePHB')||'napr. „Pomohol som susedovi…"')
            :(t('notePH')||'napr. „Oslovil som chlapíka v kaviarni…"'),
          style:{
            width:'100%',minHeight:'110px',resize:'vertical',
            background:'rgba(245,237,220,0.04)',
            border:'1px solid '+(ne?'rgba(181,69,27,0.5)':'rgba(245,237,220,0.12)'),
            color:'#F5EDD8',
            fontFamily:"'Libre Baskerville',serif",fontSize:'.9rem',
            padding:'.85rem 1rem',outline:'none',lineHeight:1.7,
            transition:'border-color .2s',
          },
          onFocus:e=>e.target.style.borderColor='rgba(192,139,42,0.4)',
          onBlur:e=>e.target.style.borderColor=ne?'rgba(181,69,27,0.5)':'rgba(245,237,220,0.12)',
        }),
        ne&&R('div',{style:{
          fontFamily:"'IBM Plex Mono',monospace",fontSize:'.9rem',
          color:'#B5451B',marginTop:'.35rem',
        }},ne)
      ),

      // Public toggle
      R('label',{style:{
        display:'flex',alignItems:'center',gap:'.6rem',
        padding:'.65rem .9rem',marginBottom:'.75rem',
        border:'1px solid '+(encPublic?'rgba(192,139,42,0.25)':'rgba(245,237,220,0.08)'),
        background:encPublic?'rgba(192,139,42,0.06)':'transparent',
        cursor:'pointer',transition:'all .2s',
        fontFamily:"'IBM Plex Mono',monospace",fontSize:'.62rem',
        color:encPublic?'rgba(245,237,220,0.7)':'rgba(245,237,220,0.35)',
        letterSpacing:'.06em',
      }},
        R('div',{style:{
          width:'18px',height:'18px',flexShrink:0,
          border:'1.5px solid '+(encPublic?'#C08B2A':'rgba(245,237,220,0.2)'),
          background:encPublic?'#C08B2A':'transparent',
          display:'flex',alignItems:'center',justifyContent:'center',
          transition:'all .2s',fontSize:'11px',color:'#0B0907',
        },onClick:e=>{e.preventDefault();setEncPublic(!encPublic);}},
          encPublic?'✓':null
        ),
        R('span',{onClick:()=>setEncPublic(!encPublic)},
          getLang()==='sk'?'Zdieľať vo verejnom feede':'Share in public feed'
        )
      ),

      // Submit — shows next rank
      R('button',{
        onClick:()=>doEncounter(task.taskType||task.id,task.pts),
        disabled:busy,
        style:{
          ...BigBtn(task.color),
          display:'flex',alignItems:'center',justifyContent:'space-between',
          padding:'1rem 1.25rem',
        },
      },
        R('span',null,busy?'…':(t('record')||'Zaznamenať')+' +'+task.pts),
        !busy&&R('span',{style:{
          fontFamily:"'Bebas Neue',sans-serif",fontSize:'1.1rem',
          opacity:.6,letterSpacing:'.05em',
        }},nextPts+' b')
      )
    );
  }

  // ── LEADERBOARD SCREEN ─────────────────────────────────────
  if(scr==='lb'){
    const sk=getLang()==='sk';
    const cityMap={},regionMap={},stateMap={},continentMap={},globalTotal={pts:0,players:0};
    Object.values(players).forEach(p=>{
      if(p.city){const k=p.city;cityMap[k]=cityMap[k]||{name:k,points:0,players:0};cityMap[k].points+=p.points||0;cityMap[k].players++;}
      if(p.region||p.city){const k=p.region||p.city;regionMap[k]=regionMap[k]||{name:k,points:0,players:0};regionMap[k].points+=p.points||0;regionMap[k].players++;}
      if(p.country){const k=p.country;stateMap[k]=stateMap[k]||{name:k,points:0,players:0};stateMap[k].points+=p.points||0;stateMap[k].players++;
        const cont=countryToContinent(p.country);continentMap[cont]=continentMap[cont]||{name:cont,points:0,players:0};continentMap[cont].points+=p.points||0;continentMap[cont].players++;}
      globalTotal.pts+=p.points||0;globalTotal.players++;
    });
    const sCities=Object.values(cityMap).sort((a,b)=>b.points-a.points);
    const sRegions=Object.values(regionMap).sort((a,b)=>b.points-a.points);
    const sStates=Object.values(stateMap).sort((a,b)=>b.points-a.points);
    const sContinents=Object.values(continentMap).sort((a,b)=>b.points-a.points);

    const myPts=me.points||0;
    const isGeo=['city','region','state','continent','global'].includes(lbTab);

    const TabBtn=(id,label)=>R('button',{key:id,onClick:()=>setLbTab(id),style:{
      fontFamily:"'IBM Plex Mono',monospace",fontSize:'.57rem',letterSpacing:'.07em',
      padding:'.45rem .75rem',border:'none',background:'transparent',cursor:'pointer',
      color:lbTab===id?'#F5EDD8':'rgba(245,237,220,0.28)',
      borderBottom:lbTab===id?'2px solid #C08B2A':'2px solid transparent',
      transition:'all .15s',whiteSpace:'nowrap',
    }},label);

    // Check if a geo entity has a license
    const geoHasLicense=(name,kind)=>{
      const k=(name||'').toLowerCase().trim();
      if(kind==='city') return !!(licensed.cities&&licensed.cities[k]);
      if(kind==='region') return !!(licensed.regions&&licensed.regions[k]);
      if(kind==='state') return !!(licensed.states&&licensed.states[k]);
      if(kind==='continent') return !!(licensed.continents&&licensed.continents[k]);
      return true;
    };

    const GeoRow=(item,i,myName,kind)=>{
      const flag=kind==='state'?countryFlag(item.name):
                 kind==='continent'?continentFlag(item.name):null;
      const licOk=geoHasLicense(item.name,kind);
      const isMine=item.name===myName;
      return R('div',{key:item.name,style:{
      display:'flex',alignItems:'center',gap:'.75rem',
      padding:'.65rem 0',
      borderBottom:'1px solid rgba(245,237,220,0.05)',
    }},
      R('div',{style:{
        fontFamily:"'Bebas Neue',sans-serif",fontSize:'.84rem',
        color:!licOk?'rgba(245,237,220,0.18)':i===0?'#C08B2A':'rgba(245,237,220,0.2)',
        width:'1.8rem',textAlign:'center',flexShrink:0,
      }},licOk?(i+1):'·'),
      flag&&R('div',{style:{
        fontSize:'1.4rem',lineHeight:1,flexShrink:0,
        filter:isMine?'none':'saturate(0.75)',
      }},flag),
      R('div',{style:{flex:1,minWidth:0}},
        R('div',{style:{
          fontFamily:"'Libre Baskerville',serif",fontSize:'.87rem',
          color:isMine?'#F5EDD8':'rgba(245,237,220,0.55)',
          fontWeight:isMine?700:400,
          display:'flex',alignItems:'center',flexWrap:'wrap',gap:'.4rem',
        }},
          R('span',null,item.name),
          isMine&&R('span',{style:{
            fontFamily:"'IBM Plex Mono',monospace",fontSize:'.6rem',
            color:'#C08B2A',border:'1px solid rgba(192,139,42,0.35)',
            padding:'.05rem .28rem',verticalAlign:'middle',
          }},'TY'),
          !licOk&&R('span',{style:{
            fontFamily:"'IBM Plex Mono',monospace",fontSize:'.55rem',
            letterSpacing:'.06em',textTransform:'uppercase',
            color:'rgba(192,139,42,0.7)',
            border:'1px solid rgba(192,139,42,0.3)',
            padding:'.05rem .3rem',
          }},sk?'bez licencie':'no license')
        ),
        R('div',{style:{
          fontFamily:"'IBM Plex Mono',monospace",fontSize:'.78rem',
          color:!licOk?'rgba(192,139,42,0.55)':'rgba(245,237,220,0.25)',
          marginTop:'.1rem',
        }},licOk?(item.players+' hráčov')
            :(sk?'zatiaľ nemá kúpenú licenciu':'no license purchased yet'))
      ),
      R('div',{style:{
        fontFamily:"'Bebas Neue',sans-serif",fontSize:'1.2rem',
        color:!licOk?'rgba(245,237,220,0.2)':isMine?'#C08B2A':'rgba(245,237,220,0.35)',
        flexShrink:0,letterSpacing:licOk?'0':'.1em',
      }},licOk?Math.round(item.points):'•••')
    );
    };

    const IndRow=(p,i)=>{
      const isMe=p.uid===me.uid;
      return R('div',{key:p.uid,style:{
        display:'flex',alignItems:'center',gap:'.75rem',
        padding:'.65rem 0',
        borderBottom:'1px solid rgba(245,237,220,0.05)',
        borderLeft:isMe?'2px solid rgba(192,139,42,0.4)':'2px solid transparent',
        paddingLeft:isMe?'.75rem':'0',transition:'all .15s',
      }},
        R('div',{style:{
          fontFamily:"'Bebas Neue',sans-serif",fontSize:'.84rem',
          color:i===0?'#C08B2A':isMe?'rgba(245,237,220,0.5)':'rgba(245,237,220,0.2)',
          width:'1.8rem',textAlign:'center',flexShrink:0,
        }},i+1),
        R('div',{style:{flex:1}},
          R('div',{style:{
            fontFamily:"'Libre Baskerville',serif",fontSize:'.87rem',
            color:isMe?'#F5EDD8':'rgba(245,237,220,0.55)',fontWeight:isMe?700:400,
          }},
            p.nickname,
            isMe&&R('span',{style:{
              fontFamily:"'IBM Plex Mono',monospace",fontSize:'.6rem',
              color:'#C08B2A',border:'1px solid rgba(192,139,42,0.35)',
              padding:'.05rem .28rem',marginLeft:'.4rem',verticalAlign:'middle',
            }},'TY')
          ),
          R('div',{style:{
            fontFamily:"'IBM Plex Mono',monospace",fontSize:'.87rem',
            color:'rgba(245,237,220,0.25)',marginTop:'.1rem',
          }},p.city+(p.country?', '+p.country:''))
        ),
        R('div',{style:{
          fontFamily:"'Bebas Neue',sans-serif",fontSize:'1.2rem',
          color:isMe?'#C08B2A':'rgba(245,237,220,0.35)',flexShrink:0,
        }},p.points||0)
      );
    };

    const emptyMsg=R('div',{style:{
      fontFamily:"'IBM Plex Mono',monospace",fontSize:'.87rem',
      color:'rgba(245,237,220,0.2)',padding:'2.5rem 0',textAlign:'center',
    }},'—');

    const renderLbContent=()=>{
      if(lbTab==='ind')
        return sPlayers.length===0?emptyMsg:R('div',null,...sPlayers.map((p,i)=>IndRow(p,i)));
      if(lbTab==='small')
        return sTeams.length===0?emptyMsg:R('div',null,...sTeams.map((t,i)=>{
          const inTeam=myTeamIds.includes(t.id);
          return R('div',{key:t.id,style:{
            display:'flex',alignItems:'center',gap:'.75rem',padding:'.65rem 0',
            borderBottom:'1px solid rgba(245,237,220,0.05)',
            borderLeft:inTeam?'2px solid rgba(192,139,42,0.4)':'2px solid transparent',
            paddingLeft:inTeam?'.75rem':'0',
          }},
            R('div',{style:{fontFamily:"'Bebas Neue',sans-serif",fontSize:'.84rem',color:i===0?'#C08B2A':'rgba(245,237,220,0.2)',width:'1.8rem',textAlign:'center',flexShrink:0}},i+1),
            R('div',{style:{flex:1}},
              R('div',{style:{fontFamily:"'Libre Baskerville',serif",fontSize:'.87rem',color:inTeam?'#F5EDD8':'rgba(245,237,220,0.55)',fontWeight:inTeam?700:400}},
                t.name,inTeam&&R('span',{style:{fontFamily:"'IBM Plex Mono',monospace",fontSize:'.6rem',color:'#C08B2A',border:'1px solid rgba(192,139,42,0.35)',padding:'.05rem .28rem',marginLeft:'.4rem',verticalAlign:'middle'}},'TÝM')),
              R('div',{style:{fontFamily:"'IBM Plex Mono',monospace",fontSize:'.87rem',color:'rgba(245,237,220,0.25)',marginTop:'.1rem'}},(t.members||[]).length+' členov')
            ),
            R('div',{style:{fontFamily:"'Bebas Neue',sans-serif",fontSize:'1.2rem',color:inTeam?'#C08B2A':'rgba(245,237,220,0.35)',flexShrink:0}},t.points||0)
          );
        }));
      if(lbTab==='big'){
        const myBgSet=new Set();myTeams.forEach(t=>{if(t.bigGroupId)myBgSet.add(t.bigGroupId);});
        return sBigGroups.length===0?emptyMsg:R('div',null,
          R('div',{style:{display:'flex',flexWrap:'wrap',gap:'.3rem',marginBottom:'.75rem'}},
            R('button',{style:{...MiniBtn,color:!lbCatFilter?'#C08B2A':'rgba(245,237,220,0.3)'},onClick:()=>setLbCatFilter('')},'Všetky'),
            categories.map(c=>R('button',{key:c.id,style:{...MiniBtn,color:lbCatFilter===c.id?'#C08B2A':'rgba(245,237,220,0.3)'},onClick:()=>setLbCatFilter(lbCatFilter===c.id?'':c.id)},c.label))
          ),
          ...sBigGroups.map((g,i)=>{
            const inBg=myBgSet.has(g.id);
            return R('div',{key:g.id,style:{display:'flex',alignItems:'center',gap:'.75rem',padding:'.65rem 0',borderBottom:'1px solid rgba(245,237,220,0.05)',borderLeft:inBg?'2px solid rgba(192,139,42,0.4)':'2px solid transparent',paddingLeft:inBg?'.75rem':'0'}},
              R('div',{style:{fontFamily:"'Bebas Neue',sans-serif",fontSize:'.84rem',color:i===0?'#C08B2A':'rgba(245,237,220,0.2)',width:'1.8rem',textAlign:'center',flexShrink:0}},i+1),
              R('div',{style:{flex:1}},
                R('div',{style:{fontFamily:"'Libre Baskerville',serif",fontSize:'.87rem',color:inBg?'#F5EDD8':'rgba(245,237,220,0.55)',fontWeight:inBg?700:400}},g.name,inBg&&R('span',{style:{fontFamily:"'IBM Plex Mono',monospace",fontSize:'.6rem',color:'#C08B2A',border:'1px solid rgba(192,139,42,0.35)',padding:'.05rem .28rem',marginLeft:'.4rem',verticalAlign:'middle'}},'MOJA')),
                R('div',{style:{fontFamily:"'IBM Plex Mono',monospace",fontSize:'.87rem',color:'rgba(245,237,220,0.25)',marginTop:'.1rem'}},g.category+(g.type?' · '+g.type:''))
              ),
              R('div',{style:{fontFamily:"'Bebas Neue',sans-serif",fontSize:'1.2rem',color:inBg?'#C08B2A':'rgba(245,237,220,0.35)',flexShrink:0}},g.points||0)
            );
          })
        );
      }
      if(lbTab==='city')
        return sCities.length===0?emptyMsg:R('div',null,...sCities.map((item,i)=>CityRow(item,i,me,licensed,cityFunding)));
      if(lbTab==='region')
        return sRegions.length===0?emptyMsg:R('div',null,...sRegions.map((r,i)=>GeoRow(r,i,me.region||me.city,'region')));
      if(lbTab==='state')
        return sStates.length===0?emptyMsg:R('div',null,...sStates.map((s,i)=>GeoRow(s,i,me.country,'state')));
      if(lbTab==='continent')
        return sContinents.length===0?emptyMsg:R('div',null,...sContinents.map((c,i)=>GeoRow(c,i,countryToContinent(me.country||''),'continent')));
      if(lbTab==='global')
        return R('div',{style:{
          border:'1px solid rgba(192,139,42,0.15)',
          background:'rgba(192,139,42,0.04)',
          padding:'2rem',textAlign:'center',marginTop:'.5rem',
        }},
          R('div',{style:{fontFamily:"'Bebas Neue',sans-serif",fontSize:'4rem',letterSpacing:'.03em',color:'#C08B2A',lineHeight:1}},globalTotal.pctDisplay||'0.00%'),
          R('div',{style:{fontFamily:"'IBM Plex Mono',monospace",fontSize:'.87rem',color:'rgba(245,237,220,0.3)',letterSpacing:'.1em',textTransform:'uppercase',marginTop:'.35rem',marginBottom:'1.25rem'}},'populácie sveta hrá'),
          R('div',{style:{height:'5px',background:'rgba(245,237,220,0.07)',borderRadius:'3px',margin:'0 0 .5rem'}},
            R('div',{style:{height:'100%',background:'#C08B2A',borderRadius:'3px',width:Math.min(100,(globalTotal.players/8300000000)*100/0.5*100)+'%'}})),
          R('div',{style:{fontFamily:"'Bebas Neue',sans-serif",fontSize:'1.6rem',color:'rgba(245,237,220,0.35)',marginTop:'1rem'}},'CHÝBA'),
          R('div',{style:{fontFamily:"'Bebas Neue',sans-serif",fontSize:'2.8rem',color:'#F5EDD8',lineHeight:1}},
            Math.max(0,Math.round(8300000000*0.5-globalTotal.players)).toLocaleString('sk-SK'))
        );
    };

    return R('div',{style:{padding:'1rem 1rem 5rem'}},
      R(Bk,{to:'home',set:setScr,l:t('back')}),
      R(Fl,{msg:flash}),
      R('h2',{style:{
        fontFamily:"'Bebas Neue',sans-serif",
        fontSize:'2.2rem',letterSpacing:'.1em',
        color:'#F5EDD8',marginBottom:'1rem',lineHeight:1,
      }},'REBRÍČEK'),

      // Tabs — groups
      R('div',{style:{
        fontFamily:"'IBM Plex Mono',monospace",fontSize:'.63rem',
        letterSpacing:'.18em',textTransform:'uppercase',
        color:'rgba(245,237,220,0.22)',marginBottom:'.4rem',
      }},'Skupiny'),
      R('div',{style:{display:'flex',borderBottom:'1px solid rgba(245,237,220,0.07)',marginBottom:'.75rem',overflowX:'auto'}},
        TabBtn('ind',t('ind')||'Jednotlivci'),
        TabBtn('small',t('small')||'Malé skupiny'),
        TabBtn('big',t('big')||'Veľké skupiny'),
      ),
      // Tabs — geo
      R('div',{style:{
        fontFamily:"'IBM Plex Mono',monospace",fontSize:'.63rem',
        letterSpacing:'.18em',textTransform:'uppercase',
        color:'rgba(245,237,220,0.22)',marginBottom:'.4rem',
      }},'Geografické'),
      R('div',{style:{display:'flex',borderBottom:'1px solid rgba(245,237,220,0.07)',marginBottom:'1rem',overflowX:'auto'}},
        TabBtn('city',sk?'Mestá':'Cities'),
        TabBtn('region',sk?'Kraje':'Regions'),
        TabBtn('state',sk?'Štáty':'Countries'),
        TabBtn('continent',sk?'Kontinent':'Continent'),
        TabBtn('global',sk?'Svet':'World'),
      ),

      R('div',{style:{minHeight:'60vh'}}, renderLbContent())
    );
  }

  // ── GROUPS SCREEN ──────────────────────────────────────────
  if(scr==='team'){
    const myBgIds=new Set();
    myTeams.forEach(t=>{if(t.bigGroupId)myBgIds.add(t.bigGroupId);});
    ((me.bigGroupIds)||[]).forEach(id=>myBgIds.add(id));
    const myBigGroupList=[...myBgIds].map(id=>bigGroups[id]).filter(Boolean);

    return R('div',{style:{padding:'1rem 1rem 5rem'}},
      R(Bk,{to:'home',set:setScr,l:t('back')}),
      R(Fl,{msg:flash}),
      R('h2',{style:{fontFamily:"'Bebas Neue',sans-serif",fontSize:'2.2rem',letterSpacing:'.1em',color:'#F5EDD8',marginBottom:'1.5rem',lineHeight:1}},'SKUPINY'),

      // My teams
      R('div',{style:{fontFamily:"'IBM Plex Mono',monospace",fontSize:'.84rem',letterSpacing:'.16em',textTransform:'uppercase',color:'rgba(245,237,220,0.28)',marginBottom:'.6rem'}},'Malé skupiny'),
      myTeams.length===0&&R('div',{style:{fontFamily:"'IBM Plex Mono',monospace",fontSize:'.84rem',color:'rgba(245,237,220,0.2)',marginBottom:'1rem'}},'Ešte nie si v žiadnom tíme.'),
      ...myTeams.map(tm=>{
        const bg=tm.bigGroupId?bigGroups[tm.bigGroupId]:null;
        const isActive=activeTeamId===tm.id;
        const isFounder=tm.founderId===me.uid;
        return R('div',{key:tm.id,style:{
          background:'rgba(245,237,220,0.03)',
          border:'1px solid '+(isActive?'rgba(192,139,42,0.35)':'rgba(245,237,220,0.08)'),
          padding:'.9rem 1rem',marginBottom:'.5rem',
        }},
          R('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'.5rem'}},
            R('div',null,
              R('div',{style:{fontFamily:"'Libre Baskerville',serif",fontWeight:700,fontSize:'.9rem',marginBottom:'.2rem'}},
                tm.name,
                isFounder&&R('span',{style:{fontFamily:"'IBM Plex Mono',monospace",fontSize:'.6rem',color:'rgba(245,237,220,0.35)',border:'1px solid rgba(245,237,220,0.15)',padding:'.05rem .28rem',marginLeft:'.35rem',verticalAlign:'middle'}},'zakladateľ')
              ),
              bg&&R('div',{style:{fontFamily:"'IBM Plex Mono',monospace",fontSize:'.87rem',color:'rgba(192,139,42,0.6)',marginBottom:'.1rem'}},'↳ '+bg.name),
              R('div',{style:{fontFamily:"'IBM Plex Mono',monospace",fontSize:'.87rem',color:'rgba(245,237,220,0.28)'}},
                'Kód: '+tm.code+' · '+(tm.members||[]).length+' členov · '+(tm.points||0)+' b')
            ),
            R('div',{style:{display:'flex',gap:'.3rem',flexWrap:'wrap',justifyContent:'flex-end'}},
              R('button',{onClick:()=>setActiveTeamId(tm.id),style:{...MiniBtn,color:isActive?'#C08B2A':'rgba(245,237,220,0.35)',borderColor:isActive?'rgba(192,139,42,0.4)':'rgba(245,237,220,0.12)'}},isActive?'✓ Aktívna':'Nastaviť'),
              !tm.bigGroupId&&isFounder&&R('button',{onClick:()=>setScr('biggroup_'+tm.id),style:{...MiniBtn,color:'rgba(192,139,42,0.6)',borderColor:'rgba(192,139,42,0.2)'}},'+Skupina'),
              R('button',{onClick:()=>toggleGroupActive('team',tm.id),style:{...MiniBtn,color:tm.active===false?'rgba(192,139,42,0.6)':'rgba(245,237,220,0.3)'}},tm.active===false?'▶':'⏸'),
              R('button',{onClick:()=>doLeaveTeam(tm.id),style:{...MiniBtn,color:'rgba(181,69,27,0.45)',borderColor:'rgba(181,69,27,0.2)'}},'↩'),
              me.uid===tm.founderId&&R('button',{onClick:()=>deleteGroup('team',tm.id),style:{...MiniBtn,color:'rgba(181,69,27,0.4)',borderColor:'rgba(181,69,27,0.15)'}},'🗑')
            )
          ),
          // Member list with kick buttons (founder only)
          isFounder&&(tm.members||[]).length>1&&R('div',{style:{
            marginTop:'.6rem',paddingTop:'.6rem',
            borderTop:'1px dashed rgba(245,237,220,0.1)',
          }},
            R('div',{style:{
              fontFamily:"'IBM Plex Mono',monospace",fontSize:'.6rem',
              letterSpacing:'.12em',textTransform:'uppercase',
              color:'rgba(245,237,220,0.3)',marginBottom:'.4rem',
            }},'Členovia skupiny'),
            ...(tm.members||[]).map(memberUid=>{
              const member=players[memberUid];
              const isMeRow=memberUid===me.uid;
              const isFounderRow=memberUid===tm.founderId;
              return R('div',{key:memberUid,style:{
                display:'flex',alignItems:'center',justifyContent:'space-between',
                padding:'.3rem 0',
              }},
                R('span',{style:{
                  fontFamily:"'Libre Baskerville',serif",fontSize:'.82rem',
                  color:isMeRow?'#F5EDD8':'rgba(245,237,220,0.55)',
                }},
                  member?member.nickname:'(neznámy)',
                  isFounderRow&&R('span',{style:{
                    fontFamily:"'IBM Plex Mono',monospace",fontSize:'.55rem',
                    color:'rgba(192,139,42,0.5)',marginLeft:'.4rem',
                  }},'· zakladateľ'),
                  isMeRow&&!isFounderRow&&R('span',{style:{
                    fontFamily:"'IBM Plex Mono',monospace",fontSize:'.55rem',
                    color:'rgba(245,237,220,0.3)',marginLeft:'.4rem',
                  }},'· ty')
                ),
                !isFounderRow&&R('button',{onClick:()=>doKickMember(tm.id,memberUid),
                  disabled:busy,style:{
                    fontFamily:"'IBM Plex Mono',monospace",fontSize:'.58rem',
                    letterSpacing:'.08em',
                    color:'rgba(181,69,27,0.6)',
                    background:'transparent',
                    border:'1px solid rgba(181,69,27,0.25)',
                    padding:'.2rem .5rem',cursor:'pointer',
                  }},'Vyhodiť')
              );
            })
          )
        );
      }),

      // My big groups
      myBigGroupList.length>0&&R('div',null,
        R('div',{style:{fontFamily:"'IBM Plex Mono',monospace",fontSize:'.84rem',letterSpacing:'.16em',textTransform:'uppercase',color:'rgba(245,237,220,0.28)',margin:'1.25rem 0 .6rem'}},'Veľké skupiny'),
        ...myBigGroupList.map(bg=>{
          const parent=bg.parentId?bigGroups[bg.parentId]:null;
          return R('div',{key:bg.id,style:{
            background:'rgba(245,237,220,0.03)',border:'1px solid rgba(245,237,220,0.08)',
            padding:'.9rem 1rem',marginBottom:'.5rem',cursor:'pointer',
          },onClick:()=>setScr('manage_bg_'+bg.id)},
            R('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},
              R('div',null,
                R('div',{style:{fontFamily:"'Libre Baskerville',serif",fontWeight:700,fontSize:'.9rem',marginBottom:'.2rem'}},
                  bg.name,bg.founderId===me.uid&&R('span',{style:{fontFamily:"'IBM Plex Mono',monospace",fontSize:'.6rem',color:'rgba(245,237,220,0.35)',border:'1px solid rgba(245,237,220,0.15)',padding:'.05rem .28rem',marginLeft:'.35rem',verticalAlign:'middle'}},'zakladateľ')),
                parent&&R('div',{style:{fontFamily:"'IBM Plex Mono',monospace",fontSize:'.87rem',color:'rgba(192,139,42,0.55)',marginBottom:'.1rem'}},'↳ '+parent.name),
                R('div',{style:{fontFamily:"'IBM Plex Mono',monospace",fontSize:'.87rem',color:'rgba(245,237,220,0.28)'}},bg.category+(bg.type?' · '+bg.type:'')+' · '+bg.points+' b')
              ),
              R('span',{style:{fontFamily:"'IBM Plex Mono',monospace",fontSize:'.62rem',color:'rgba(245,237,220,0.3)'}},'Spravovať →')
            )
          );
        })
      ),

      // Join BG direct
      R('div',{style:{
        fontFamily:"'IBM Plex Mono',monospace",fontSize:'.84rem',letterSpacing:'.16em',
        textTransform:'uppercase',color:'rgba(245,237,220,0.28)',margin:'1.25rem 0 .6rem',
      }},'Pripojiť sa ku veľkej skupine'),
      R('div',{style:{display:'flex',gap:'.5rem',marginBottom:'1.5rem'}},
        R(Inp,{val:bgCode,set:v=>setBgCode(v.toUpperCase()),ph:'Kód skupiny',mono:true,mb0:true,style:{flex:1}}),
        R('button',{onClick:()=>doJoinBigGroupDirect(bgCode),disabled:busy,style:{...MiniBtn,flexShrink:0,padding:'.55rem 1rem'}},busy?'…':'Pripojiť sa')
      ),

      R('div',{style:{borderTop:'1px solid rgba(245,237,220,0.07)',marginTop:'.5rem',paddingTop:'1.25rem'}}),

      // Create team
      R('div',{style:{fontFamily:"'IBM Plex Mono',monospace",fontSize:'.84rem',letterSpacing:'.16em',textTransform:'uppercase',color:'rgba(245,237,220,0.28)',marginBottom:'.6rem'}},'Vytvoriť / pripojiť sa'),
      R('div',{style:{display:'flex',gap:0,marginBottom:'1rem',borderBottom:'1px solid rgba(245,237,220,0.07)'}},
        ['create','join'].map(tab=>R('button',{key:tab,onClick:()=>setTtab(tab),style:{
          flex:1,padding:'.55rem',fontFamily:"'IBM Plex Mono',monospace",fontSize:'.62rem',
          letterSpacing:'.08em',textTransform:'uppercase',border:'none',background:'transparent',
          cursor:'pointer',color:ttab===tab?'#F5EDD8':'rgba(245,237,220,0.3)',
          borderBottom:ttab===tab?'2px solid #C08B2A':'2px solid transparent',transition:'all .15s',
        }},tab==='create'?'Vytvoriť malú skupinu':'Pripojiť sa kódom'))
      ),
      R(Err,{m:te}),
      ttab==='create'?R('div',null,
        R('div',{style:{fontFamily:"'IBM Plex Mono',monospace",fontSize:'.87rem',letterSpacing:'.12em',textTransform:'uppercase',color:'rgba(245,237,220,0.3)',marginBottom:'.35rem',display:'block'}},'Názov skupiny'),
        R(Inp,{val:tName,set:setTName,ph:'napr. Partiička zo schodov',onEnter:doCreateTeam,mb0:true}),
        R('button',{onClick:doCreateTeam,disabled:busy,style:{...BigBtn('#8C2410'),marginTop:'1rem'}},busy?'…':'Vytvoriť')
      ):R('div',null,
        R('div',{style:{fontFamily:"'IBM Plex Mono',monospace",fontSize:'.87rem',letterSpacing:'.12em',textTransform:'uppercase',color:'rgba(245,237,220,0.3)',marginBottom:'.35rem',display:'block'}},'Kód skupiny'),
        R(Inp,{val:tCode,set:v=>setTCode(v.toUpperCase()),ph:'napr. AB3X7K',mono:true,onEnter:doJoinTeam,mb0:true}),
        R('button',{onClick:doJoinTeam,disabled:busy,style:{...BigBtn('#8C2410'),marginTop:'1rem'}},busy?'…':'Pripojiť sa')
      ),

      // Shop link
      R('div',{style:{borderTop:'1px solid rgba(245,237,220,0.07)',marginTop:'1.5rem',paddingTop:'1.25rem'}}),
      R('button',{onClick:()=>setScr('cityshop'),style:{
        ...BigBtn('transparent'),
        border:'1px solid rgba(192,139,42,0.25)',
        color:'rgba(192,139,42,0.7)',
      }},'🏙️ '+t('shop'))
    );
  }

  // ── CITY SHOP ──────────────────────────────────────────────

  // ── FEED SCREEN ──────────────────────────────────────────
  if(scr==='feed'){
    const sk=getLang()==='sk';
    // feedTab state is declared above with other useState calls

    // Collect all encounters from all players with player info
    const allEnc=[];
    Object.values(players).forEach(p=>{
      const pEnc=Array.isArray(p.encounters)?p.encounters:p.encounters?Object.values(p.encounters):[];
      pEnc.filter(e=>e!=null).forEach(enc=>{
        // Global feed: public encounters, OR encounters with meaningful notes (2+ words)
        const hasNote=enc.note&&enc.note.trim().split(/\s+/).length>=2;
        if(enc.public||hasNote){
          allEnc.push({...enc,nickname:p.nickname||'?',uid:p.uid,
            playerCity:p.city||'',playerCountry:p.country||''});
        }
      });
    });
    allEnc.sort((a,b)=>(b.date||'').localeCompare(a.date||''));

    const myEnc=(Array.isArray(me.encounters)?me.encounters:me.encounters?Object.values(me.encounters):[]).filter(e=>e!=null).map(enc=>({...enc,nickname:me.nickname,uid:me.uid,
      playerCity:me.city||'',playerCountry:me.country||''}));

    const isMyFeed=feedTab==='my';
    const feedList=isMyFeed?myEnc:allEnc;

    const typeEmoji=(type)=>type==='bridging'?'🤝':type==='bonding1'?'💛':type==='bonding2'?'🤜':'📝';
    const typeLabel=(type)=>{
      if(sk) return type==='bridging'?'Nové zoznámenie':type==='bonding1'?'Dobro pre blízkeho':type==='bonding2'?'Prehĺbenie vzťahu':'Stretnutie';
      return type==='bridging'?'New encounter':type==='bonding1'?'Good for someone close':type==='bonding2'?'Deepened a relationship':'Encounter';
    };

    const timeAgo=(dateStr)=>{
      if(!dateStr) return '';
      const diff=Date.now()-new Date(dateStr).getTime();
      const mins=Math.floor(diff/60000);
      if(mins<1) return sk?'práve teraz':'just now';
      if(mins<60) return mins+(sk?' min':' min');
      const hrs=Math.floor(mins/60);
      if(hrs<24) return hrs+(sk?' hod':' hr');
      const days=Math.floor(hrs/24);
      if(days<7) return days+(sk?' d':' d');
      const weeks=Math.floor(days/7);
      return weeks+(sk?' týž':' w');
    };

    return R('div',{style:{paddingBottom:'5rem'}},
      // Header
      R('div',{style:{
        padding:'1.2rem 1rem .8rem',
        borderBottom:'1px solid rgba(245,237,220,0.06)',
      }},
        R('div',{style:{
          fontFamily:"'Bebas Neue',sans-serif",
          fontSize:'1.8rem',letterSpacing:'.12em',
          color:'#F5EDD8',marginBottom:'.6rem',
        }},sk?'PRÍBEHY':'STORIES'),
        R('div',{style:{
          fontFamily:"'IBM Plex Mono',monospace",
          fontSize:'.87rem',letterSpacing:'.08em',
          color:'rgba(245,237,220,0.3)',marginBottom:'.8rem',
          lineHeight:1.6,
        }},sk?'Každé stretnutie je príbeh. Tu sú naše.':'Every encounter is a story. Here are ours.'),

        // Tabs
        R('div',{style:{display:'flex',gap:0,borderBottom:'1px solid rgba(245,237,220,0.06)'}},
          ['global','my'].map(tab=>
            R('button',{key:tab,onClick:()=>setFeedTab(tab),
              style:{
                flex:1,padding:'.65rem',border:'none',background:'transparent',
                fontFamily:"'IBM Plex Mono',monospace",fontSize:'.6rem',
                letterSpacing:'.14em',textTransform:'uppercase',cursor:'pointer',
                color:feedTab===tab?'#F5EDD8':'rgba(245,237,220,0.28)',
                borderBottom:feedTab===tab?'2px solid #C08B2A':'2px solid transparent',
                transition:'all .15s',
              }},
              tab==='global'?(sk?'Všetci':'Everyone'):(sk?'Moje':'Mine')
            )
          )
        )
      ),

      // Feed list
      feedList.length===0?
        R('div',{style:{
          padding:'3rem 1rem',textAlign:'center',
          fontFamily:"'Libre Baskerville',serif",
          fontSize:'.9rem',fontStyle:'italic',
          color:'rgba(245,237,220,0.25)',
        }},sk?'Zatiaľ žiadne verejné stretnutia. Zdieľaj svoje prvé!':'No public encounters yet. Share your first one!'):

        R('div',{style:{padding:'.5rem 0'}},
          ...feedList.slice(0,50).map((enc,i)=>{
            const isMe=enc.uid===me.uid;
            const cc=COUNTRY_FLAGS[enc.playerCountry];
            const flag=cc?flagEmoji(cc):'';
            return R('div',{key:i,style:{
              padding:'.85rem 1rem',
              borderBottom:'1px solid rgba(245,237,220,0.04)',
              animation:'slideInUp .4s '+(Math.min(i,8)*0.04)+'s ease both',
            }},
              // Top row: emoji + name + time
              R('div',{style:{
                display:'flex',alignItems:'center',gap:'.5rem',
                marginBottom:enc.note?'.4rem':0,
              }},
                R('span',{style:{fontSize:'1.1rem',lineHeight:1}},typeEmoji(enc.type)),
                R('span',{style:{
                  fontFamily:"'Libre Baskerville',serif",
                  fontSize:'.84rem',
                  color:isMe?'#F5EDD8':'rgba(245,237,220,0.6)',
                  fontWeight:isMe?700:400,flex:1,
                  overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',
                }},
                  enc.nickname,
                  flag&&R('span',{style:{marginLeft:'.35rem',fontSize:'.9rem'}},flag),
                  enc.city&&R('span',{style:{
                    fontFamily:"'IBM Plex Mono',monospace",
                    fontSize:'.9rem',color:'rgba(245,237,220,0.22)',
                    marginLeft:'.4rem',letterSpacing:'.06em',
                  }},enc.city)
                ),
                isMyFeed&&R('span',{style:{
                  fontSize:'.63rem',flexShrink:0,marginRight:'.15rem',
                  opacity:.4,
                }},enc.public?'🌐':'🔒'),
                R('span',{style:{
                  fontFamily:"'IBM Plex Mono',monospace",
                  fontSize:'.63rem',color:'rgba(245,237,220,0.18)',
                  letterSpacing:'.06em',flexShrink:0,
                }},timeAgo(enc.date))
              ),
              // Note text
              enc.note&&R('div',{style:{
                fontFamily:"'Libre Baskerville',serif",
                fontSize:'.84rem',fontStyle:'italic',
                color:'rgba(245,237,220,0.45)',
                lineHeight:1.7,
                paddingLeft:'1.6rem',
                marginTop:'.15rem',
              }},'"'+enc.note+'"'),
              // Type label
              R('div',{style:{
                fontFamily:"'IBM Plex Mono',monospace",
                fontSize:'.6rem',letterSpacing:'.12em',
                color:'rgba(192,139,42,0.35)',
                textTransform:'uppercase',
                paddingLeft:'1.6rem',
                marginTop:'.25rem',
              }},typeLabel(enc.type))
            );
          })
        ),

      // My encounters count
      isMyFeed&&myEnc.length>0&&R('div',{style:{
        padding:'1rem',textAlign:'center',
        fontFamily:"'IBM Plex Mono',monospace",
        fontSize:'.84rem',color:'rgba(245,237,220,0.2)',
        letterSpacing:'.12em',
      }},(sk?'Celkom stretnutí: ':'Total encounters: ')+myEnc.length)
    );
  }

  if(scr==='cityshop')return R(CityShop,{me,onBack:setScr});
  if(scr==='join_bg_direct')return R('div',null,
    R(Bk,{to:'team',set:setScr,l:t('back')}),
    R('div',{style:S.eye},'Pripojiť sa ku veľkej skupine'),
    R('h3',{style:{...S.h,fontSize:'1.6rem'}},'Zadaj ',R('em',{style:S.hEm},'kód skupiny')),
    R('div',{style:S.card},
      R('div',{style:{fontSize:'.87rem',color:'rgba(250,245,239,0.5)',lineHeight:1.6,marginBottom:'1.25rem'}},
        'Kód dostaneš od zakladateľa skupiny (napr. zboru alebo oblasti).'),
      R(Lbl,{c:'Kód skupiny'}),
      R(Inp,{val:bgCode,set:v=>setBgCode(v.toUpperCase()),ph:'napr. ZB9K2M',mono:true,mb0:true}),
      bge&&R(Err,{m:bge}),
      R(Btn,{onClick:()=>doJoinBigGroupDirect(bgCode),v:'p',full:true,busy,
        s:{marginTop:'1rem'}},'Pripojiť sa')
    )
  );

  if(scr==='reqcat')return R(RequestCategory,{me,onBack:setScr,onSubmitted:()=>setScr('team')});

  // BigGroup screens (dynamic id)
  if(scr&&scr.startsWith('biggroup_')){
    const teamId=scr.replace('biggroup_','');
    const team=teams[teamId];
    const myBg=team&&team.bigGroupId?bigGroups[team.bigGroupId]:null;
    const isFounder=myBg&&myBg.founderId===me.uid;

    // Build ancestor chain for current biggroup
    const getAncestors=(bgId)=>{
      const chain=[];let cur=bgId;
      while(cur&&bigGroups[cur]){chain.push(bigGroups[cur]);cur=bigGroups[cur].parentId||null;}
      return chain;
    };
    const getChildren=(bgId)=>Object.values(bigGroups).filter(g=>g.parentId===bgId);

    const ancestors=myBg?getAncestors(myBg.id):[];
    const parent=myBg&&myBg.parentId?bigGroups[myBg.parentId]:null;
    const children=myBg?getChildren(myBg.id):[];

    return R('div',null,
      R(Bk,{to:'team',set:setScr,l:t('back')}),
      R(Fl,{msg:flash}),
      R('div',{style:S.eye},'Veľká skupina'),
      R('h3',{style:{...S.h,fontSize:'1.6rem'}},team?team.name:'Tím'),

      // ── Ak tím NEMÁ veľkú skupinu ──
      !myBg&&R('div',null,
        R('div',{style:{fontSize:'.87rem',color:'rgba(250,245,239,0.5)',lineHeight:1.7,marginBottom:'1.5rem'}},
          'Veľká skupina združuje malé skupiny rovnakého typu. Môžeš vytvoriť novú alebo sa pripojiť ku existujúcej kódom.'),
        R('div',{style:{display:'flex',borderBottom:'1px solid rgba(250,245,239,0.1)',marginBottom:'1.25rem'}},
          R('button',{onClick:()=>setBgtab('create'),style:bgtab==='create'?S.tabA:S.tab},'Vytvoriť novú'),
          R('button',{onClick:()=>setBgtab('join'),style:bgtab==='join'?S.tabA:S.tab},'Pripojiť kódom')
        ),
        bge&&R(Err,{m:bge}),
        bgtab==='create'?R('div',{style:S.card},
          R(Lbl,{c:'Názov'}),
          R(Inp,{val:bgName,set:setBgName,ph:'napr. Oddiel sv. Juraja'}),
          R(CategoryPicker,{categories,selectedCat:bgCat,selectedType:bgType,
            onCat:setBgCat,onType:setBgType,onRequestNew:()=>setScr('reqcat')}),
          R(Btn,{onClick:()=>doCreateBigGroup(teamId),v:'p',full:true,busy,s:{marginTop:'1rem'}},'Vytvoriť')
        ):R('div',{style:S.card},
          R(Lbl,{c:'Kód skupiny'}),
          R(Inp,{val:bgCode,set:v=>setBgCode(v.toUpperCase()),ph:'napr. ZB9K2M',mono:true,mb0:true}),
          R(Btn,{onClick:()=>doJoinBigGroup(teamId),v:'p',full:true,busy,s:{marginTop:'1rem'}},'Pripojiť sa')
        )
      ),

      // ── Ak tím MÁ veľkú skupinu ──
      myBg&&R('div',null,

        // Hierarchia — strom nahor
        R('div',{style:{...S.card,marginBottom:'.75rem'}},
          R('div',{style:{...S.lbl,marginBottom:'.75rem'}},'Hierarchia skupín'),
          // Zobraz reťaz od koreňa nadol
          R('div',{style:{display:'flex',flexDirection:'column',gap:'.4rem'}},
            [...ancestors].reverse().map((g,i)=>{
              const isCurrent=g.id===myBg.id;
              return R('div',{key:g.id,style:{
                display:'flex',alignItems:'center',gap:'.5rem',
                paddingLeft:(i*1.2)+'rem'}},
                R('span',{style:{color:'rgba(250,245,239,0.2)',fontFamily:"'DM Mono',monospace",fontSize:'.87rem'}},
                  i===0?'▶':' └'),
                R('div',{style:{
                  padding:'.4rem .8rem',
                  border:'1px solid '+(isCurrent?'#C4603A':'rgba(250,245,239,0.15)'),
                  background:isCurrent?'rgba(196,96,58,0.1)':'transparent',
                  fontFamily:"'DM Mono',monospace",fontSize:'.84rem',
                  color:isCurrent?'#FAF5EF':'rgba(250,245,239,0.5)',
                  flex:1}},
                  g.name,
                  isCurrent&&R('span',{style:{marginLeft:'.5rem',color:'#C4603A'}},'← ty'),
                  R('span',{style:{marginLeft:'.5rem',opacity:.4}},'· '+g.points+' b')
                )
              );
            }),
            // Deti tejto skupiny
            children.length>0&&R('div',{style:{marginTop:'.5rem'}},
              R('div',{style:{...S.lbl,marginBottom:'.4rem'}},'Podradené skupiny ('+children.length+')'),
              children.map(c=>R('div',{key:c.id,style:{
                display:'flex',alignItems:'center',gap:'.5rem',
                paddingLeft:'1.2rem',marginBottom:'.3rem'}},
                R('span',{style:{color:'rgba(250,245,239,0.2)',fontFamily:"'DM Mono',monospace",fontSize:'.87rem'}},' └'),
                R('div',{style:{fontFamily:"'DM Mono',monospace",fontSize:'.84rem',
                  color:'rgba(250,245,239,0.45)',padding:'.35rem .7rem',
                  border:'1px solid rgba(250,245,239,0.1)',flex:1}},
                  c.name,' · ',c.points,' b')
              ))
            )
          ),
          R('div',{style:{fontFamily:"'DM Mono',monospace",fontSize:'.63rem',
            color:'rgba(250,245,239,0.28)',marginTop:'.75rem'}},
            'Kód: '+myBg.code,
            myBg.category&&' · '+myBg.category+(myBg.type?' / '+myBg.type:'')
          )
        ),

        // Pripojiť k nadradenej — vždy viditeľné pre zakladateľa
        isFounder&&R('div',{style:{...S.card,marginBottom:'.75rem'}},
          R(Lbl,{c:'Nadradená skupina'}),
          parent&&R('div',{style:{
            display:'flex',alignItems:'center',justifyContent:'space-between',
            flexWrap:'wrap',gap:'.5rem',padding:'.65rem 1rem',
            background:'rgba(184,136,42,0.07)',border:'1px solid rgba(184,136,42,0.2)',
            marginBottom:'.75rem'}},
            R('div',null,
              R('div',{style:{fontFamily:"'DM Mono',monospace",fontSize:'.63rem',
                color:'rgba(184,136,42,0.7)',textTransform:'uppercase',
                letterSpacing:'.1em',marginBottom:'.15rem'}},'Zaradená v'),
              R('div',{style:{fontWeight:500,color:'#FAF5EF'}},parent.name)
            ),
            R('div',{style:{display:'flex',gap:'.4rem'}},
              R(Btn,{onClick:()=>setScr('manage_bg_'+parent.id),v:'m',
                s:{fontSize:'.84rem',padding:'.3rem .65rem'}},'Otvoriť'),
              R(Btn,{onClick:()=>doLeaveParentGroup(myBg.id),v:'m',busy,
                s:{fontSize:'.84rem',padding:'.3rem .65rem',
                  color:'rgba(196,96,58,0.6)'}},'Odpojiť')
            )
          ),
          // Tabs: pripojiť kódom | vytvoriť novú
          R('div',{style:{display:'flex',borderBottom:'1px solid rgba(250,245,239,0.1)',
            marginBottom:'1rem'}},
            R('button',{onClick:()=>setShowCreateParent(false),
              style:!showCreateParent?S.tabA:S.tab},'Pripojiť kódom'),
            R('button',{onClick:()=>setShowCreateParent(true),
              style:showCreateParent?S.tabA:S.tab},'Vytvoriť novú')
          ),
          bge2&&R(Err,{m:bge2}),
          !showCreateParent
            ?R('div',null,
                R('div',{style:{fontSize:'.84rem',color:'rgba(250,245,239,0.4)',
                  marginBottom:'.6rem'}},
                  parent?'Zmeniť nadradenú skupinu:':'Zadaj kód existujúcej skupiny:'),
                R('div',{style:{display:'flex',gap:'.5rem',alignItems:'flex-end'}},
                  R('div',{style:{flex:1}},
                    R(Inp,{val:bgParentCode,set:v=>setBgParentCode(v.toUpperCase()),
                      ph:'kód skupiny, napr. ZB9K2M',mono:true,mb0:true})
                  ),
                  R(Btn,{onClick:()=>doJoinParentGroup(myBg.id),v:'p',busy,
                    s:{padding:'.7rem 1rem',whiteSpace:'nowrap'}},
                    parent?'Zmeniť':'Zaradiť')
                )
              )
            :R('div',null,
                R('div',{style:{fontSize:'.84rem',color:'rgba(250,245,239,0.4)',
                  marginBottom:'.75rem',lineHeight:1.6}},
                  'Vytvor novú nadradenú skupinu (napr. zbor pre oddiel). '+myBg.name+' sa do nej automaticky zaradí.'),
                R(Lbl,{c:'Názov novej skupiny'}),
                R(Inp,{val:bgParentName,set:setBgParentName,
                  ph:'napr. 75. zbor Jána Vojtaššáka'}),
                R(CategoryPicker,{categories,
                  selectedCat:bgParentCat,selectedType:bgParentType,
                  onCat:setBgParentCat,onType:setBgParentType,
                  onRequestNew:()=>setScr('reqcat')}),
                R(Btn,{onClick:()=>doCreateParentGroup(myBg.id),v:'p',full:true,busy,
                  s:{marginTop:'1rem'}},'Vytvoriť a zaradiť')
              )
        ),

        // Info pre ne-zakladateľov
        !isFounder&&R('div',{style:{...S.card,marginBottom:'.75rem'}},
          R('div',{style:{fontFamily:"'DM Mono',monospace",fontSize:'.84rem',color:'rgba(250,245,239,0.35)',letterSpacing:'.1em',textTransform:'uppercase'}}),
          R('div',{style:{fontSize:'.87rem',color:'rgba(250,245,239,0.5)'}},'Hierarchiu môže spravovať len zakladateľ skupiny.')
        )
      )
    );
  }

  // ══ SPRÁVA VEĽKEJ SKUPINY ════════════════════════════════
  if(scr&&scr.startsWith('manage_bg_')){
    const bgId=scr.replace('manage_bg_','');
    const bg=bigGroups[bgId];
    if(!bg) return R('div',null,R(Bk,{to:'team',set:setScr,l:t('back')}),R('div',{style:S.err},'Skupina nenájdená.'));

    const isFounder=bg.founderId===me.uid;
    const isMember=(bg.members||[]).includes(me.uid)||
      (bg.teamIds||[]).some(tid=>(teams[tid]&&(teams[tid].members||[]).includes(me.uid)));
    const parent=bg.parentId?bigGroups[bg.parentId]:null;

    // Build full ancestor chain
    const getChain=(id)=>{
      const chain=[];let cur=id;
      while(cur&&bigGroups[cur]){chain.push(bigGroups[cur]);cur=bigGroups[cur].parentId||null;}
      return chain;
    };
    const chain=getChain(bgId);
    const children=Object.values(bigGroups).filter(g=>g.parentId===bgId);
    const childTeams=(bg.teamIds||[]).map(id=>teams[id]).filter(Boolean);

    // Geographic level this biggroup unlocks at
    const geoLevels=[
      {label:'Vždy aktívne',min:0},
      {label:'Vždy aktívne',min:0},
      {label:'Odomkne sa s mestom',min:50},
      {label:'Odomkne sa s krajom',min:100},
      {label:'Odomkne sa so štátom',min:150},
      {label:'Odomkne sa s globálnou',min:200},
    ];

    return R('div',null,
      R(Bk,{to:'team',set:setScr,l:t('back')}),
      R(Fl,{msg:flash}),
      R('div',{style:S.eye},'Správa skupiny'),
      R('h3',{style:{...S.h,fontSize:'1.6rem'}},bg.name),
      R('div',{style:{fontFamily:"'DM Mono',monospace",fontSize:'.63rem',
        color:'rgba(250,245,239,0.35)',marginBottom:'1rem',letterSpacing:'.08em'}},
        bg.category+(bg.type?' · '+bg.type:'')+' · Kód: ',
        R('strong',{style:{color:'#B8882A',letterSpacing:'.15em'}},bg.code),
        ' · '+bg.points+' bodov'
      ),

      // Ak nemá nadradenú — formulár hore ako výzva na akciu
      isFounder&&!parent&&R('div',{style:{...S.cardGold,marginBottom:'.75rem'}},
        R('div',{style:{fontFamily:"'DM Mono',monospace",fontSize:'.84rem',
          color:'#B8882A',letterSpacing:'.1em',textTransform:'uppercase',
          marginBottom:'.5rem'}},'Zaraď skupinu do vyššieho celku'),
        R('div',{style:{fontSize:'.87rem',color:'rgba(250,245,239,0.6)',
          lineHeight:1.6,marginBottom:'.75rem'}},
          'Táto skupina zatiaľ nie je súčasťou žiadneho zboru, farnosti ani iného vyššieho celku. Zadaj kód nadradenej skupiny.'),
        bge2&&R(Err,{m:bge2}),
        R('div',{style:{display:'flex',gap:'.5rem',alignItems:'flex-end'}},
          R('div',{style:{flex:1}},
            R(Inp,{val:bgParentCode,set:v=>setBgParentCode(v.toUpperCase()),
              ph:'kód nadradenej skupiny',mono:true,mb0:true})
          ),
          R(Btn,{onClick:()=>doJoinParentGroup(bgId),v:'g',busy,
            s:{padding:'.7rem 1rem',whiteSpace:'nowrap'}},'Zaradiť')
        ),
        R('div',{style:{fontFamily:"'DM Mono',monospace",fontSize:'.63rem',
          color:'rgba(250,245,239,0.3)',marginTop:'.5rem'}},'Nemáš kód? Požiadaj vedúceho zboru.')
      ),

      // Hierarchia
      R('div',{style:{...S.card,marginBottom:'.75rem'}},
        R(Lbl,{c:'Hierarchia'}),
        R('div',{style:{display:'flex',flexDirection:'column',gap:'.35rem'}},
          [...chain].reverse().map((g,i)=>{
            const isCur=g.id===bgId;
            return R('div',{key:g.id,
              style:{display:'flex',alignItems:'center',gap:'.5rem',paddingLeft:(i*1.25)+'rem',cursor:isCur?'default':'pointer'},
              onClick:()=>!isCur&&setScr('manage_bg_'+g.id)},
              R('span',{style:{fontFamily:"'DM Mono',monospace",fontSize:'.87rem',
                color:'rgba(250,245,239,0.2)',flexShrink:0}},i===0?'◆':' └'),
              R('div',{style:{
                padding:'.35rem .75rem',flex:1,
                border:'1px solid '+(isCur?'#C4603A':'rgba(250,245,239,0.12)'),
                background:isCur?'rgba(196,96,58,0.1)':'rgba(250,245,239,0.03)',
                fontFamily:"'DM Mono',monospace",fontSize:'.84rem',
                color:isCur?'#FAF5EF':'rgba(250,245,239,0.5)'}},
                g.name,
                !isCur&&R('span',{style:{marginLeft:'.4rem',fontSize:'.87rem',color:'rgba(250,245,239,0.25)'}},'→ otvoriť'),
                R('span',{style:{marginLeft:'.5rem',opacity:.35}},'· '+g.points+' b')
              )
            );
          }),
          // Podradené skupiny
          children.length>0&&children.map(c=>R('div',{key:c.id,
            style:{display:'flex',alignItems:'center',gap:'.5rem',
              paddingLeft:(chain.length*1.25)+'rem',cursor:'pointer'},
            onClick:()=>setScr('manage_bg_'+c.id)},
            R('span',{style:{fontFamily:"'DM Mono',monospace",fontSize:'.87rem',
              color:'rgba(250,245,239,0.15)',flexShrink:0}},' └'),
            R('div',{style:{padding:'.35rem .75rem',flex:1,
              border:'1px solid rgba(250,245,239,0.08)',
              fontFamily:"'DM Mono',monospace",fontSize:'.84rem',
              color:'rgba(250,245,239,0.38)'}},
              c.name,' · ',c.points,' b',
              R('span',{style:{marginLeft:'.4rem',fontSize:'.87rem',color:'rgba(250,245,239,0.25)'}},'→ otvoriť')
            )
          )),
          // Malé skupiny (tímy)
          childTeams.length>0&&R('div',{style:{marginTop:'.25rem'}},
            childTeams.map(t=>R('div',{key:t.id,
              style:{display:'flex',alignItems:'center',gap:'.5rem',
                paddingLeft:(chain.length*1.25)+'rem',marginTop:'.25rem'}},
              R('span',{style:{fontFamily:"'DM Mono',monospace",fontSize:'.87rem',
                color:'rgba(250,245,239,0.1)',flexShrink:0}},' └'),
              R('div',{style:{padding:'.25rem .6rem',
                border:'1px dashed rgba(250,245,239,0.08)',
                fontFamily:"'DM Mono',monospace",fontSize:'.63rem',
                color:'rgba(250,245,239,0.25)'}},
                '👥 '+t.name+' · '+(t.members||[]).length+' členov')
            ))
          )
        )
      ),

      // Pripojiť k nadradenej — vždy viditeľné pre zakladateľa
      isFounder&&R('div',{style:{...S.card,marginBottom:'.75rem'}},
        R(Lbl,{c:'Nadradená skupina'}),

        // Ak má nadradenú — zobraz info + tlačidlo na zmenu
        parent&&R('div',{style:{marginBottom:'1rem'}},
          R('div',{style:{display:'flex',alignItems:'center',
            justifyContent:'space-between',flexWrap:'wrap',gap:'.5rem',
            padding:'.65rem 1rem',background:'rgba(184,136,42,0.07)',
            border:'1px solid rgba(184,136,42,0.2)',marginBottom:'.5rem'}},
            R('div',null,
              R('div',{style:{fontFamily:"'DM Mono',monospace",fontSize:'.63rem',
                color:'rgba(184,136,42,0.7)',textTransform:'uppercase',
                letterSpacing:'.1em',marginBottom:'.15rem'}},'Aktuálne zaradená v'),
              R('div',{style:{fontWeight:500,color:'#FAF5EF',fontSize:'.9rem'}},parent.name)
            ),
            R('div',{style:{display:'flex',gap:'.4rem'}},
              R(Btn,{onClick:()=>setScr('manage_bg_'+parent.id),v:'m',
                s:{fontSize:'.84rem',padding:'.3rem .65rem'}},'Otvoriť'),
              R(Btn,{onClick:()=>doLeaveParentGroup(bgId),v:'m',busy,
                s:{fontSize:'.84rem',padding:'.3rem .65rem',
                  color:'rgba(196,96,58,0.6)'}},'Odpojiť')
            )
          )
        ),

        // Tabs: pripojiť kódom | vytvoriť novú
        R('div',{style:{display:'flex',borderBottom:'1px solid rgba(250,245,239,0.1)',
          marginBottom:'1rem'}},
          R('button',{onClick:()=>setShowCreateParent(false),
            style:!showCreateParent?S.tabA:S.tab},'Pripojiť kódom'),
          R('button',{onClick:()=>setShowCreateParent(true),
            style:showCreateParent?S.tabA:S.tab},'Vytvoriť novú')
        ),
        bge2&&R(Err,{m:bge2}),
        !showCreateParent
          ?R('div',null,
              R('div',{style:{fontSize:'.84rem',color:'rgba(250,245,239,0.4)',
                marginBottom:'.6rem'}},
                parent?'Zmeniť nadradenú skupinu:':'Zadaj kód existujúcej skupiny:'),
              R('div',{style:{display:'flex',gap:'.5rem',alignItems:'flex-end'}},
                R('div',{style:{flex:1}},
                  R(Inp,{val:bgParentCode,set:v=>setBgParentCode(v.toUpperCase()),
                    ph:'kód skupiny, napr. ZB9K2M',mono:true,mb0:true})
                ),
                R(Btn,{onClick:()=>doJoinParentGroup(bgId),v:'p',busy,
                  s:{padding:'.7rem 1rem',whiteSpace:'nowrap'}},
                  parent?'Zmeniť':'Zaradiť')
              )
            )
          :R('div',null,
              R('div',{style:{fontSize:'.84rem',color:'rgba(250,245,239,0.4)',
                marginBottom:'.75rem',lineHeight:1.6}},
                'Vytvor novú nadradenú skupinu (napr. zbor, farnosť). '+bg.name+' sa do nej automaticky zaradí.'),
              R(Lbl,{c:'Názov novej skupiny'}),
              R(Inp,{val:bgParentName,set:setBgParentName,
                ph:'napr. 75. zbor Jána Vojtaššáka'}),
              R(CategoryPicker,{categories,
                selectedCat:bgParentCat,selectedType:bgParentType,
                onCat:setBgParentCat,onType:setBgParentType,
                onRequestNew:()=>setScr('reqcat')}),
              R(Btn,{onClick:()=>doCreateParentGroup(bgId),v:'p',full:true,busy,
                s:{marginTop:'1rem'}},'Vytvoriť a zaradiť')
            )
      ),

      // Opustiť skupinu (pre členov čo nie sú zakladatelia)
      !isFounder&&isMember&&R('div',{style:{...S.card,marginBottom:'.75rem'}},
        R(Lbl,{c:'Členstvo'}),
        R('div',{style:{fontSize:'.87rem',color:'rgba(250,245,239,0.5)',marginBottom:'.75rem'}},'Si členom tejto skupiny.'),
        R(Btn,{onClick:()=>doLeaveBigGroupDirect(bgId),v:'m',busy,
          s:{color:'rgba(196,96,58,0.6)',fontSize:'.9rem'}},'Opustiť skupinu')
      ),

      // Zapnúť/Vypnúť + zmazať (zakladateľ alebo admin)
      (isFounder||isAdmin(me))&&R('div',{style:{...S.card,marginBottom:'.75rem'}},
        R(Lbl,{c:'Správa skupiny'}),
        R('div',{style:{display:'flex',gap:'.5rem',flexWrap:'wrap'}},
          R(Btn,{onClick:()=>toggleGroupActive('bg',bgId),v:'m',busy,
            s:{fontSize:'.9rem',
              color:bg.active===false?'rgba(184,136,42,0.8)':'rgba(250,245,239,0.5)'}},
            bg.active===false?'▶ Zapnúť skupinu':'⏸ Vypnúť skupinu'),
          isAdmin(me)&&R(Btn,{onClick:()=>deleteGroup('bg',bgId),v:'m',busy,
            s:{fontSize:'.9rem',color:'rgba(196,96,58,0.6)',
              borderColor:'rgba(196,96,58,0.25)'}},'🗑 Zmazať skupinu')
        ),
        bg.active===false&&R('div',{style:{fontFamily:"'DM Mono',monospace",fontSize:'.63rem',
          color:'rgba(184,136,42,0.5)',marginTop:'.75rem',lineHeight:1.6}},
          'Vypnutá skupina sa nezobrazuje v rebríčku ale body sa zachovávajú.')
      )
    );
  }

  return null;
}

const root=document.getElementById('game-root');
if(root)ReactDOM.createRoot(root).render(R(App,null));


// Translate static HTML elements
(function(){
  var lang = localStorage.getItem('hps:lang') || 
    ((navigator.language||'').toLowerCase().match(/^(sk|cs)/) ? 'sk' : 'en');
  var backEl = document.getElementById('g-back-text');
  if(backEl && lang === 'en') backEl.textContent = '← back to site';
})();


</script>
</body>
</html>
